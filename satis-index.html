<style>
/* Layout: field-instrument app — sticky header, horizontal section tabs, one column of form cards; report renders as a white A4 sheet */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E2E8E5; --ink:#15201D; --muted:#5A6964; --line:#C9D3CF;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#D4EAE5;
  --ok:#23704A; --ok-bg:#DAF0E2; --warn:#7F5A00; --warn-bg:#FAEDC4; --bad:#AE2014; --bad-bg:#FADDD8; --idle:#8A9893;
  --paper:#FFFFFF; --paper-ink:#1B1F1E; --paper-line:#B9C2BF; --paper-head:#123B35; --paper-soft:#E6EEEB;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.cols2{display:grid;gap:0 16px}
.col{min-width:0}
@media (min-width:1000px){.wrap,header.top .bar,header.top .tabs{max-width:1120px}.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols2 .col>.card:first-child{margin-top:0}}
.drop{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;cursor:pointer;background:var(--bg);color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{color:var(--accent)}
.maptbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.maptbl table{border-collapse:collapse;width:100%;font-size:12px}
.maptbl th,.maptbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.maptbl th{background:var(--surface2);position:sticky;top:0}
.maptbl td.num{font-family:var(--f-num)}
.fsum{display:flex;gap:8px;flex-wrap:wrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 20px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.sync{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}.sync.ok{color:var(--ok)}.sync.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:focus-visible,.tab:focus-visible,.tcard:focus-visible,.dchip:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;max-width:760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:20px;font:600 14px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .n{font:500 11px var(--f-num);opacity:.7}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2.sec{font:700 22px/1.15 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 4px;text-wrap:balance}
p.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin-bottom:12px}
.card h3{margin:0;font:700 15px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;min-height:44px}

<script>
/* ================= Satış və Anbar — CORE =================
   The same code runs in two places:
   • on the Google Apps Script server (file Core.gs) — the real rules, enforced there;
   • in the app's demo mode (no server) — so the program can be tried without setup.
   saHandle(db,user,action,payload) reads the in-memory database and returns {res, ch}:
   res = answer for the app, ch = changed rows the caller must save. */
var SA_ROLES={isci:"İşçi (satış)",anbardar:"Anbardar",muhasib:"Mühasib",admin:"Rəhbər"};
var SA_ROLE_ALIASES={"işçi":"isci","isci":"isci","satış":"isci","anbardar":"anbardar","mühasib":"muhasib","muhasib":"muhasib","mühasibat":"muhasib","rəhbər":"admin","rehber":"admin","admin":"admin","müdir":"admin"};
/* ZUVAND Servis: a person's rights are the modules the manager ticked for them.
   role = "admin" (rəhbər, everything) or "p:satis,anbar,…"; the old role names still work. */
var SA_MODS={servis:"Servis hesabatları",tesdiq:"Təsdiq və tapşırıqlar",satis:"Satış (təkliflər)",anbar:"Anbar",muhasibat:"Mühasibat",xerc:"Xərclər və maaşlar"};
function saPerms(r){r=String(r||"");var o={};if(r==="admin"){for(var k in SA_MODS)o[k]=1;o.admin=1;return o}
  if(r.indexOf("p:")===0){r.slice(2).split(",").forEach(function(x){x=x.trim();if(SA_MODS[x])o[x]=1});return o}
  if(r==="isci")o.satis=1;else if(r==="anbardar")o.anbar=1;else if(r==="muhasib"){o.muhasibat=1;o.satis=1;o.xerc=1}return o}
function saHas(r){var P=saPerms(r);for(var i=1;i<arguments.length;i++)if(P[arguments[i]])return true;return !!P.admin}
var SA_CAN={
  seeCost:function(r){return saHas(r,"muhasibat")},           /* gəliş qiyməti, mənfəət */
  editItem:function(r){return saHas(r,"anbar","muhasibat")},
  setPrice:function(r){return saHas(r,"muhasibat")},          /* gəliş + satış qiyməti, hesab-ödəniş */
  moveStock:function(r){return saHas(r,"anbar")},             /* mədaxil / məxaric / düzəliş */
  seeMoves:function(r){return saHas(r,"anbar","muhasibat")},
  quote:function(r){return saHas(r,"satis","muhasibat")},
  invoice:function(r){return saHas(r,"muhasibat")},           /* qaiməni daxil edib təsdiqləmək */
  receive:function(r){return saHas(r,"anbar")},               /* qaimə üzrə malı anbarda qəbul etmək */
  contract:function(r){return saHas(r,"muhasibat")},          /* xidməti müqavilələr */
  seeContracts:function(r){return saHas(r,"satis","muhasibat")},
  editAnyQuote:function(r){return saHas(r,"muhasibat")},
  linePrice:function(r){return saHas(r,"muhasibat")},
  unlimitedDisc:function(r){return saHas(r,"muhasibat")},
  expense:function(r){return saHas(r,"xerc")},               /* ofis xərcləri, maaşlar, vergilər */
  admin:function(r){return saPerms(r).admin===1}
};
function saRoleLabel(r){r=String(r||"");if(SA_ROLES[r])return SA_ROLES[r];var P=saPerms(r);return Object.keys(SA_MODS).filter(function(k){return P[k]}).map(function(k){return SA_MODS[k]}).join(", ")||"—"}
var SA_STATUS={draft:"Qaralama",sent:"Göndərildi",accepted:"Qəbul edildi",rejected:"İmtina",done:"Təhvil verildi"};
var SA_KIND={in:"Mədaxil",out:"Məxaric",adj:"Düzəliş"};
/* company expenses (mühasibat): office, salaries, taxes, other */
var SA_EXP_CATS=["Ofis icarəsi","Kommunal (işıq, su, qaz)","İnternet və telefon","Maaş","Vergi və sosial ödənişlər","Nəqliyyat və yanacaq","Dəftərxana və ofis ləvazimatı","Bank xərcləri","Təmir və avadanlıq","Reklam","Anbar itkisi (silinmə)","Digər"];
var SA_EXP_PAY=["Köçürmə","Nağd","Kart"];
var SA_PERIOD={m:["Aylıq",1],q:["Rüblük",3],h:["Yarımillik",6],y:["İllik",12]};
/* "2026 — IV rüb", "Oktyabr 2026" … : which period of the contract a sale belongs to */
var SA_MONTHS=["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"],SA_ROMAN=["I","II","III","IV"];
function saPeriodLabel(date,per){var m=/^(\d{4})-(\d{2})/.exec(String(date||""));if(!m)return "";var y=m[1],mo=+m[2]-1;
  if(per==="m")return SA_MONTHS[mo]+" "+y;if(per==="h")return y+" — "+(mo<6?"I":"II")+" yarımil";if(per==="y")return y+"-ci il";return y+" — "+SA_ROMAN[Math.floor(mo/3)]+" rüb"}
var SA_INV_STATUS={draft:"Qaralama",approved:"Anbarda yoxlanır",received:"Qəbul edildi"};
var SA_CATS=["UPS","Akkumulyator","Stabilizator","Dizel generator","Elektrik paneli / ATS","Ehtiyat hissə","Kabel və aksesuar","Xidmət"];
var SA_UNITS=["ədəd","dəst","metr","kq","litr","saat","xidmət"];
var SA_DEFAULTS={co:"ZUVAND Grand System",coaddr:"",cotel:"",coemail:"",covoen:"",bank:"",prefix:"TK",valid:15,vat:18,maxDisc:10,
  pay:"50% avans, qalan 50% təhvil-təslimdən sonra 5 iş günü ərzində",
  delivery:"Anbarda olan mallar — 3 iş günü; sifarişlə gətirilən mallar — 4–6 həftə",
  warranty:"Avadanlıq üçün istehsalçı zəmanəti — 12 ay; görülən işlərə — 6 ay",note:"",svcSheet:"",svcFrom:""};
var SA_SETTING_KEYS=Object.keys(SA_DEFAULTS);

function saNum(v){if(v===null||v===undefined||v==="")return 0;if(typeof v==="number")return isFinite(v)?v:0;
  var n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function saR2(n){return Math.round((n+Number.EPSILON)*100)/100}
function saId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function saRole(v){var k=String(v||"").trim().toLowerCase();return SA_ROLE_ALIASES[k]||(SA_ROLES[k]?k:"")}
function saStr(v,max){return String(v==null?"":v).slice(0,max||500)}

function saLineSum(l){return saR2(saNum(l.qty)*saNum(l.price)*(1-saNum(l.disc)/100))}
function saTotals(q){var gross=0,net=0;(q.lines||[]).forEach(function(l){gross+=saR2(saNum(l.qty)*saNum(l.price));net+=saLineSum(l)});
  net=saR2(net);gross=saR2(gross);var rate=q.vat===false?0:saNum(q.vatRate);var vat=saR2(net*rate/100);
  return {gross:gross,disc:saR2(gross-net),net:net,rate:rate,vat:vat,total:saR2(net+vat)}}

/* stock: q = qalıq (in − out ± adj), r = rezerv (accepted quotes, not yet issued), a = mövcud */
function saIssued(db){var m={};db.moves.forEach(function(x){if(x.del||x.kind!=="out"||!x.quoteId)return;var k=x.quoteId+"|"+x.itemId;m[k]=(m[k]||0)+saNum(x.qty)});return m}
/* a quote line is goods ("mal": reserved and issued from the warehouse) or a service ("xid": installation, rack, labour — never touches stock) */
function saLineType(l,items){if(l.t==="mal"||l.t==="xid")return l.t;if(l.svc===1)return "xid";if(l.svc===2)return "mal";var it=l.itemId&&items?items[l.itemId]:null;if(it)return it.svc?"xid":"mal";return "xid"}
function saQuoteNeed(q,items){var need={};(q.lines||[]).forEach(function(l){if(!l.itemId)return;var it=items[l.itemId];if(!it||it.svc||saLineType(l,items)==="xid")return;need[l.itemId]=(need[l.itemId]||0)+saNum(l.qty)});return need}
function saStock(db){var S={},items={};db.items.forEach(function(i){items[i.id]=i;S[i.id]={q:0,r:0,a:0}});
  db.moves.forEach(function(m){if(m.del||!S[m.itemId])return;var n=saNum(m.qty);S[m.itemId].q+=m.kind==="out"?-n:n});
  var iss=saIssued(db);
  db.quotes.forEach(function(q){if(q.del||q.status!=="accepted")return;var need=saQuoteNeed(q,items);
    Object.keys(need).forEach(function(id){if(!S[id])return;S[id].r+=Math.max(0,need[id]-(iss[q.id+"|"+id]||0))})});
  Object.keys(S).forEach(function(id){var s=S[id];s.q=saR2(s.q);s.r=saR2(s.r);s.a=saR2(s.q-s.r)});return S}
function saRemaining(db,q){var items={};db.items.forEach(function(i){items[i.id]=i});var need=saQuoteNeed(q,items),iss=saIssued(db),out={};
  Object.keys(need).forEach(function(id){out[id]={need:need[id],issued:iss[q.id+"|"+id]||0,left:Math.max(0,saR2(need[id]-(iss[q.id+"|"+id]||0)))}});return out}

function saPubItem(i,role){var o={};for(var k in i)o[k]=i[k];if(!SA_CAN.seeCost(role)){delete o.cost}return o}
function saNormName(s){return String(s||"").toLocaleLowerCase("az").replace(/\u0307/g,"").replace(/ı/g,"i").replace(/ə/g,"e").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/[^a-z0-9]+/g," ").trim()}
function saInvTotals(v){var net=0,vat=0;(v.lines||[]).forEach(function(l){var s=saR2(saNum(l.qty)*saNum(l.price));net+=s;vat+=saNum(l.vat)});net=saR2(net);vat=saR2(vat);return {net:net,vat:vat,total:saR2(net+vat)}}
function saPubInv(v,role){var o={};for(var k in v)o[k]=v[k];if(!SA_CAN.seeCost(role)){o.lines=(v.lines||[]).map(function(l){var c={};for(var k in l)if(k!=="price"&&k!=="vat"&&k!=="sum"&&k!=="fprice")c[k]=l[k];return c});delete o.net;delete o.vat;delete o.total;if(o.imp)o.imp={cur:o.imp.cur,gb:o.imp.gb}}
  else{var t=saInvTotals(v);o.net=t.net;o.vat=t.vat;o.total=t.total}return o}
function saPubMove(m,role){var o={};for(var k in m)o[k]=m[k];if(!SA_CAN.seeCost(role))delete o.cost;return o}
function saKindOf(q){return q.kind==="svc"||q.kind==="sale"?q.kind:(q.src&&q.src.type==="service"?"svc":"sale")}
function saSummary(q){var t=saTotals(q);return {id:q.id,no:q.no||"",kind:saKindOf(q),inv:(q.bill&&q.bill.inv)||"",date:q.date||"",status:q.status||"draft",client:(q.cl&&q.cl.name)||"",cl:q.cl||{},subj:q.subj||"",per:q.per||"",conId:q.conId||"",
  net:t.net,total:t.total,n:(q.lines||[]).length,author:q.author||"",by:q.by||"",updatedAt:q.updatedAt||0,svc:q.src?(q.src.repno||"servis"):"",site:q.src&&q.src.site?q.src.site:"",contractId:q.src?q.src.contractId:"",zero:(q.lines||[]).some(function(l){return !saNum(l.price)}),
  bill:(q.bill&&q.bill.st)||"",nocon:!!(q.src&&q.src.nocon&&!q.del),billDoc:(q.bill&&q.bill.doc)||"",due:!!((q.status==="accepted"||q.status==="done")&&!(q.bill&&q.bill.st==="paid")&&!(q.src&&q.src.nocon)),delAt:q.del?saNum(q.delAt||q.updatedAt):0,delBy:q.del?(q.delBy||q.by||""):""}}
/* purchase prices written on quote lines are seen only by accounting */
function saPubQuote(q,role){if(!q||SA_CAN.seeCost(role))return q;var o={};for(var k in q)o[k]=q[k];o.lines=(q.lines||[]).map(function(l){var c={};for(var k in l)if(k!=="cost")c[k]=l[k];return c});return o}
/* a quote that has gone further than a draft offer: deleting it needs the manager's deletion password */
function saProtected(db,q){if(q.status==="accepted"||q.status==="done"||q.bill||(q.src&&q.src.type==="service"))return true;
  return db.moves.some(function(m){return !m.del&&m.kind==="out"&&m.quoteId===q.id})}
/* contract price row for one serviced device: serial № first, then the object + device name */
function saTok(x){return String(x||"").toLowerCase().replace(/kva/g," kva ").split(/[^0-9a-zəöüğıçşа-я.]+/i).filter(function(t){return t&&t.length>1||/\d/.test(t)})}
var SA_GENERIC=["ups","kva","kw","generator","stabilizator","ats","avr","duzlendirici","kompensator","cihaz","online"];
function saKva(x){var m=/(\d+(?:[.,]\d+)?)\s*kva/i.exec(String(x||""));return m?parseFloat(m[1].replace(",",".")):null}
/* one word equals another, or differs by one letter (typos like "Socomee" / "Socomec") */
function saLev1(a,b){if(a===b)return true;if(a.length<5||b.length<5||Math.abs(a.length-b.length)>1||/\d/.test(a)||/\d/.test(b))return false;
  var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a.charAt(i)===b.charAt(j)){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
/* a row can be used as many times as its count (Say) */
function saRowCap(r){return Math.max(1,Math.round(saNum(r&&r.n))||1)}
/* the same "serial" in several rows is not a serial number (often the e-qaimə service code pasted by mistake) */
function saFakeSn(L){var c={},o={},snn=function(x){return String(x||"").toLowerCase().replace(/\s+/g,"")};L.forEach(function(r){var k=snn(r.sn);if(k)c[k]=(c[k]||0)+1});for(var k in c)if(c[k]>1)o[k]=1;return o}
function saPriceRow(con,site,d,used){var L=con.plist||[],i=d.info||d.ups||{},snn=function(x){return String(x||"").toLowerCase().replace(/\s+/g,"")},sn=snn(i.sn),best=-1,bs=0,fake=saFakeSn(L);
  var free=function(k){return (used[k]||0)<saRowCap(L[k])},rsn=function(r){var x=snn(r.sn);return fake[x]?"":x};
  if(sn)for(var k=0;k<L.length;k++)if(free(k)&&rsn(L[k])===sn)return k;
  var kv=i.kva!==undefined&&String(i.kva).trim()!==""?parseFloat(String(i.kva).replace(",",".")):null;
  var sites={};L.forEach(function(r){if(r.site)sites[saNormName(r.site)]=1});var multi=Object.keys(sites).length>1;
  var loc=String(d.loc||"").trim(),siteHit=function(r){return !r.site||(!site&&!loc)||saNameHit(r.site,site,true)||(loc&&saNameHit(r.site,loc,true))},kvaOk=function(r){var rk=saKva(r.name);return kv===null||isNaN(kv)||rk===null||Math.abs(rk-kv)<0.01};
  var dt=saTok([i.brand,i.model,kv!==null?kv+" kva":""].join(" ")).map(saNormName).filter(function(t){return SA_GENERIC.indexOf(t)<0});
  var hit=function(t,arr){for(var z=0;z<arr.length;z++)if(saLev1(t,arr[z]))return true;return false};
  for(var k2=0;k2<L.length;k2++){var r=L[k2];if(!free(k2)||!kvaOk(r))continue;var sh=siteHit(r);if(!sh&&multi)continue;
    var rt=saTok(r.name).map(saNormName).filter(function(t){return SA_GENERIC.indexOf(t)<0}),sc=rt.filter(function(t){return hit(t,dt)}).length+(r.site&&sh?0.5:0)-(sh?0:0.5)-(rsn(r)&&sn?0.6:0);
    if(sc>bs){bs=sc;best=k2}}
  if(best>=0&&bs>=1)return best;
  /* one device left for this object (same kVA if known): take it */
  var cand=[];for(var k3=0;k3<L.length;k3++){var r3=L[k3];if(free(k3)&&!(rsn(r3)&&sn)&&siteHit(r3)&&kvaOk(r3))cand.push(k3)}
  return cand.length===1?cand[0]:-1}
var SA_DEVTYPE={ups:"UPS",avr:"ATS AVR",gen:"generator",svr:"stabilizator",rect:"düzləndirici",pfc:"kompensator"};
function saDevName(d){var i=d.info||d.ups||{};return ([i.brand,i.model].filter(Boolean).join(" ")+(i.kva?" "+i.kva+" kVA":"")).trim()||SA_DEVTYPE[d.type]||"Cihaz"}
/* compact copy of the serviced devices, kept on the sale so it can be priced later from a contract */
function saDevsOf(devs){return devs.map(function(d){var i=d.info||d.ups||{};return {type:saStr(d.type,10),loc:saStr(d.loc,160),info:{brand:saStr(i.brand,60),model:saStr(i.model,80),kva:saStr(i.kva,20),sn:saStr(i.sn,60)}}})}
/* one service line per device, priced from the contract's device list (or one line at the contract's visit price) */
function saContractLines(con,site,devs,info){var cname="Texniki xidmət — "+SA_PERIOD[con.period][0].toLowerCase()+" müqavilə"+(con.no?" № "+con.no:""),lines=[];
  if(con.plist&&con.plist.length){var used={};
    devs.forEach(function(d,di){var i=d.info||d.ups||{},k=saPriceRow(con,site,d,used),row=k>=0?con.plist[k]:null;if(k>=0)used[k]=(used[k]||0)+1;
      lines.push({id:saId("l"),itemId:"",svc:1,name:"Texniki xidmət — "+(row&&row.name?row.name:saDevName(d))+(i.sn?" (SN "+saStr(i.sn,60)+")":"")+(d.loc?" — "+saStr(d.loc,160):""),
        desc:(di===0&&info?info+"\n":"")+(row?cname:"Müqavilənin cihaz siyahısında tapılmadı — qiyməti yazın"),unit:"xidmət",qty:1,price:row?row.price:0,disc:0,crow:k,csn:saStr(i.sn,60)})})}
  if(!lines.length)lines.push({id:saId("l"),itemId:"",svc:1,name:cname,desc:info||"",unit:"xidmət",qty:1,price:con.plist&&con.plist.length?0:con.price,disc:0});
  return lines}
var SA_SVCLINE=/^(Texniki xidmət|Servis xidməti)/;
/* contract helpers */
function saAddMonths(iso,n){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");if(!m)return "";var y=+m[1],mo=+m[2]-1+n,last=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
  return new Date(Date.UTC(y,mo,Math.min(+m[3],last))).toISOString().slice(0,10)}
/* two names are the same company: equal after normalising, or (fallback) every word of the shorter one (6+ letters) is a word of the longer one */
function saNameHit(a,b,loose){a=saNormName(a);b=saNormName(b);if(!a||!b)return false;if(a===b)return true;if(!loose)return false;
  var s=a.length<=b.length?a:b,l=s===a?b:a;if(s.length<6)return false;var lt=l.split(" ");return s.split(" ").every(function(t){return lt.indexOf(t)>=0})}
function saContractFor(db,name,date){if(!saNormName(name))return null;
  var live=(db.contracts||[]).filter(function(c){return !c.del&&c.kind!=="sale"&&c.active!==false&&!(date&&((c.start&&date<c.start)||(c.end&&date>c.end)))});
  var names=function(c){return [c.client].concat(String(c.aliases||"").split(/[,;\n]/)).concat(String(c.sites||"").split(/[,;\n]/)).filter(function(x){return String(x).trim()})};
  var pick=function(L){var best=null;L.forEach(function(c){if(!best||String(c.start)>String(best.start))best=c});return best};
  var exact=live.filter(function(c){return names(c).some(function(x){return saNameHit(x,name)})});if(exact.length)return pick(exact);
  /* loose match only when it points to one company */
  var loose=live.filter(function(c){return names(c).some(function(x){return saNameHit(x,name,true)})}),cl={};loose.forEach(function(c){cl[saNormName(c.client)]=1});
  return Object.keys(cl).length===1?pick(loose):null}
function saPartItem(db,p){var code=String(p.code||"").trim().toLowerCase(),nn=saNormName(p.name);if(!code&&!nn)return null;
  var byCode=code?db.items.filter(function(it){return it.active!==false&&(String(it.code).toLowerCase()===code||(it.model&&saNormName(it.model)===saNormName(code)))}):[];
  if(byCode.length>1&&nn){var bn=byCode.filter(function(x){return saNormName(x.name)===nn||String(x.alias||"").split("|").indexOf(nn)>=0})[0];if(bn)return bn}
  if(byCode.length)return byCode[0];

function saSettings(db){var s={};SA_SETTING_KEYS.forEach(function(k){s[k]=db.settings[k]!==undefined&&db.settings[k]!==""?db.settings[k]:SA_DEFAULTS[k]});

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const dayOf=ts=>{const d=new Date(ts);return isNaN(d)?"":d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
function fmtDate(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?m[3]+"."+m[2]+"."+m[1]:""}
function addDays(iso,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");if(!m)return "";const d=new Date(+m[1],+m[2]-1,+m[3]+Math.round(saNum(n)));return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function money(n){n=saR2(saNum(n));const neg=n<0,[i,f]=Math.abs(n).toFixed(2).split(".");return (neg?"−":"")+i.replace(/\B(?=(\d{3})+(?!\d))/g," ")+","+f}
const AZN=n=>money(n)+" ₼";
function qf(n){n=saR2(saNum(n));return String(n).replace(".",",")}
function getP(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}
const norm=s=>String(s||"").toLocaleLowerCase("az").replace(/[ıi̇]/g,"i").replace(/ə/g,"e").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ç/g,"c").replace(/ğ/g,"g");

/* SHA-256 of the deletion password: only the hash is stored and sent */
async function sha256(txt){const data=new TextEncoder().encode(String(txt));
  try{if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}}catch(e){}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],l=data.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(data);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8);const r=(x,c)=>(x>>>c)|(x<<(32-c)),w=new Uint32Array(64);
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0}
    let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    [a,b,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0)}
  return H.map(v=>v.toString(16).padStart(8,"0")).join("")}

    /* 1) queued catalog / stock / settings changes, in the order they were made */
    while(state.outbox.length){const op=state.outbox[0];
      try{await api(op.action,op.payload)}
      catch(e){if(!e.server)throw e;const c=e.data&&e.data.error;if(c==="busy")break;if(!(c==="notfound"&&/^del/.test(op.action)))failed.push(errMsg(e))}
      state.outbox.shift();saveOutbox()}
    /* 2) quotes (after the catalog, so new items exist on the server) */
    for(const id of [...state.pending]){const q=state.local[id];if(!q){state.pending.delete(id);continue}
      if(state.cur&&state.cur.id===id&&state.dirty)continue;
      if(!quoteHasContent(q))continue;
      const sentAt=q.localAt||0;
      try{const r=await api("saveQuote",{quote:q,baseAt:q.baseAt||0});const now=state.local[id];
        if(now&&(now.localAt||0)>sentAt){now.no=now.no||r.quote.no;now.baseAt=r.quote.updatedAt;now.updatedAt=r.quote.updatedAt;if(r.quote.src)now.src=r.quote.src}
        else{state.pending.delete(id);applyServerQuote(r.quote)}}
      catch(e){if(!e.server)throw e;state.pending.delete(id);
        if(e.data&&e.data.error==="conflict"&&e.data.quote){applyServerQuote(e.data.quote);toast("Bu təklif başqa cihazda dəyişdirilib — yeni versiya yükləndi")}
        else{failed.push("Təklif: "+errMsg(e));try{const g=await api("getQuote",{id});applyServerQuote(g.quote)}catch(_){}}}}
    saveLocal();
    try{await uploadInvoicePdfs()}catch(e){}
    /* 3) fresh data from the server */
    applyBoot(await api("boot",{full:1}));
    notifyDue();
    /* 4) keep recent quotes on the device so they open without internet */
    const stale=Object.values(state.remote).filter(s=>!state.pending.has(s.id)&&(!state.local[s.id]||(state.local[s.id].updatedAt||0)<(s.updatedAt||0)))
      .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,40).map(s=>s.id);
    if(stale.length){const g=await api("getQuotes",{ids:stale});(g.quotes||[]).forEach(q=>{if(!(state.cur&&state.cur.id===q.id&&state.dirty))applyServerQuote(q)})}
    for(const id in state.local)if(!state.remote[id]&&!state.pending.has(id)&&state.local[id].no)delete state.local[id];
    saveLocal();state.online=true;state.syncErr="";state.lastSync=Date.now();saveCache();
  }catch(e){state.online=false;state.syncErr=errMsg(e)}
  finally{state.syncing=false;badge();scheduleSync(state.online?syncEvery():Math.min(syncEvery(),60000));
    if(failed.length){state.syncErr=failed.join("; ");toast("Serverdə qəbul olunmadı: "+failed[0]+(failed.length>1?" (+"+(failed.length-1)+")":""))}
    if(!editorBusy()&&["quotes","catalog","stock","moves","contracts","invoices","expenses","customers"].includes(state.view))render()}}

async function xlsxDownload(name,sheets){if(!await needLib("XLSX")){toast("Excel kitabxanası yüklənmədi (internet?)");return}
  const wb=XLSX.utils.book_new();sheets.forEach(([title,rows,widths])=>{const ws=XLSX.utils.aoa_to_sheet(rows);if(widths)ws["!cols"]=widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,title.slice(0,31))});
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});await saveFile(name,new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}
const IMPORT_COLS={code:["kod","code","artikul","sku","şifrə"],name:["ad","adı","mal","malın adı","name","məhsul","adı və təsviri"],cat:["kateqoriya","category","qrup"],brand:["brend","brand","marka","istehsalçı"],
  model:["model"],unit:["vahid","ölçü vahidi","unit"],desc:["təsvir","description","izah","texniki göstəricilər"],cost:["gəliş qiyməti","gəliş","alış qiyməti","alış","maya dəyəri","cost"],
  price:["satış qiyməti","satış","qiymət","price"],min:["min. qalıq","min qalıq","minimum","min"],svc:["xidmət","service"],qty:["qalıq","say","miqdar","stock","anbar"]};

  await xlsxDownload("Kataloq_"+today()+".xlsx",[["Kataloq",rows,[16,40,18,12,16,8,40,12,12,10,8,10,10,10]]])}
async function importCatalog(file){if(!await needLib("XLSX")){toast("Excel kitabxanası yüklənmədi");return}
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  let hr=-1,map={};for(let r=0;r<Math.min(A.length,15)&&hr<0;r++){const m={};A[r].forEach((h,c)=>{const k=String(h).trim().toLocaleLowerCase("az");for(const f in IMPORT_COLS)if(m[f]===undefined&&IMPORT_COLS[f].includes(k))m[f]=c});if(m.code!==undefined&&m.name!==undefined){hr=r;map=m}}
  if(hr<0){toast("Başlıq sətri tapılmadı: ən azı “Kod” və “Ad” sütunları olmalıdır");return null}
  const items=A.slice(hr+1).map(row=>{const o={};for(const f in map)o[f]=row[map[f]];return o}).filter(o=>String(o.code||"").trim()&&String(o.name||"").trim());
  return {items,cols:Object.keys(map),file:file.name}}

  if(can("moveStock"))h+=`<div class="actions" style="margin-bottom:12px"><button class="btn pri" data-mk="in">+ Mədaxil</button><button class="btn" data-mk="out">− Məxaric</button><button class="btn" data-mk="adj">Düzəliş (inventar)</button></div>`;
  if(acc.length&&(can("moveStock")||can("seeMoves")))h+=`<div class="card remind"><h3>Təhvil gözləyən təkliflər · ${acc.length}</h3>${acc.map(s=>`<button class="rrow" data-q="${s.id}"><span><b>${esc(s.no)}</b> · ${esc(s.client)}${s.svc?' <span class="chip warn">servis '+esc(s.svc)+'</span>':""}</span><span class="note">${fmtDate(s.date)} · ${can("moveStock")?"məxaric et →":"bax →"}</span></button>`).join("")}</div>`;
  if(can("receive")&&invWaiting())h+=`<button class="rrow remind" id="goInv" style="margin-bottom:12px"><span><b>${invWaiting()} alış qaiməsi</b> anbarda yoxlanmağı gözləyir</span><span class="note">aç →</span></button>`;
  const shipW=(state.invoices||[]).filter(v=>v.dir==="out"&&v.status==="approved");if(can("moveStock")&&shipW.length)h+=`<button class="rrow remind" id="goShip" style="margin-bottom:12px"><span><b>${shipW.length} satış qaiməsi</b> üzrə mallar təhvil gözləyir: ${shipW.slice(0,3).map(v=>esc(v.supplier)).join(", ")}</span><span class="note">aç →</span></button>`;
  {const need={};listQuotes().filter(s=>s.status==="accepted").forEach(s=>{const r=state.remaining[s.id];if(!r)return;Object.keys(r).forEach(id=>{if(r[id].left>0){(need[id]=need[id]||{n:0,q:[]}).n+=r[id].left;need[id].q.push(s.no)}})});
    const buy=Object.keys(need).map(id=>({it:state.items.find(i=>i.id===id),n:need[id].n,q:need[id].q,have:Math.max(0,stk(id).q)})).filter(x=>x.it&&x.n>x.have+1e-9);
    if(buy.length&&(can("moveStock")||can("seeMoves")||can("invoice")))h+=`<div class="card" style="border-left:4px solid var(--bad);margin-bottom:12px"><h3>Alınmalı mallar · ${buy.length}</h3><p class="note" style="margin:0">Qəbul edilmiş təkliflər üçün anbarda kifayət qədər yoxdur. Alınıb mədaxil olunanda təklif üzrə məxaric edin.</p>
      ${buy.map(x=>`<p style="margin:2px 0;font-size:13.5px"><b>${esc(x.it.name)}</b> <span class="note no">${esc(x.it.code)}</span> — lazım ${qf(x.n)}, anbarda ${qf(x.have)} · <b style="color:var(--bad)">alınmalı ${qf(saR2(x.n-x.have))}</b> <span class="note">(${x.q.map(esc).join(", ")})</span></p>`).join("")}</div>`}
  if(low.length)h+=`<div class="banner" style="margin:0 0 12px">${low.length} mal minimum qalıqdan azdır: ${low.slice(0,4).map(i=>esc(i.name)).join(", ")}${low.length>4?"…":""}</div>`;

  <div class="stbl"><table><tr><th>Mal</th><th class="n">Qalıq</th><th class="n">Rezerv</th><th class="n">Mövcud</th><th class="n">Min.</th>${sc?'<th class="n">Gəliş</th><th class="n">Dəyər, ₼</th>':""}</tr>

    <td class="n"><span class="chip ${c}">${qf(s.a)}</span></td><td class="n">${saNum(i.min)?qf(i.min):""}</td>${sc?`<td class="n">${saNum(i.cost)?money(i.cost):'<span class="chip warn">—</span>'}</td><td class="n">${money(Math.max(0,s.q)*saNum(i.cost))}</td>`:""}</tr>`}).join("")

  $$(".filters button").forEach(b=>b.onclick=()=>{state.sf=b.dataset.f;renderStock()});
  $("#cq").oninput=e=>{state.cq=e.target.value;const p=e.target.selectionStart;renderStock();const i=$("#cq");i.focus();i.setSelectionRange(p,p)};
  $("#bExp").onclick=()=>xlsxDownload("Anbar_qaligi_"+today()+".xlsx",[["Qalıq",[["Kod","Ad","Kateqoriya","Vahid","Qalıq","Rezerv","Mövcud","Min. qalıq",...(sc?["Gəliş qiyməti","Maya dəyəri"]:[]),"Satış qiyməti"],
    ...goods.map(i=>{const s=stk(i.id);return [i.code,i.name,i.cat,i.unit,s.q,s.r,s.a,saNum(i.min),...(sc?[saNum(i.cost),saR2(Math.max(0,s.q)*saNum(i.cost))]:[]),saNum(i.price)]})],[16,40,18,8,10,10,10,10,12,14,12]]])}

/* lines of one document (same op / same qaimə) are shown together */
function groupMoves(list){const out=[],idx={};list.forEach(m=>{const op=String(m.id).match(/^(o[a-z0-9]+)_\d+$/);
  const k=op?op[1]:(m.doc||m.quoteNo)?[m.kind,m.date,m.doc,m.party,m.quoteNo,m.by].join("|"):m.id;if(idx[k]===undefined){idx[k]=out.length;out.push([])}out[idx[k]].push(m)});return out}
async function loadMoves(force){if(force||!state.moves){if(!state.moves)state.moves=[];await sync()}return state.moves||[]}
function moveRow(m,compact){const sc=can("seeCost"),sign=m.kind==="out"?"−":m.kind==="adj"&&saNum(m.qty)<0?"":"+",cls=m.kind==="out"||saNum(m.qty)<0?"out":"in";
  return `<div class="mrowx" data-mid="${m.id}">${compact?"<span></span>":`<span class="kchip ${m.kind}">${SA_KIND[m.kind]}</span>`}<span><b>${esc(m.name)}</b> <span class="note no">${esc(m.code)}</span></span><span class="q ${cls}">${sign}${qf(m.qty)}</span>
    <span class="meta">${compact?"":`<span>${fmtDate(m.date)}</span>${m.doc?`<span>Sənəd: ${esc(m.doc)}</span>`:""}${m.party?`<span>${esc(m.party)}</span>`:""}${m.quoteNo?`<span>Təklif ${esc(m.quoteNo)}</span>`:""}${m.note?`<span>${esc(m.note)}</span>`:""}<span>${esc(m.by)}</span>`}${m.pending?'<span class="chip warn">göndərilməyib</span>':""}
    ${sc&&saNum(m.cost)?`<span class="money">${money(m.cost)} × ${qf(Math.abs(m.qty))} = ${money(Math.abs(m.qty)*m.cost)} ₼</span>`:""}${sc&&m.kind==="in"&&!saNum(m.cost)?'<span class="chip warn">gəliş qiyməti yazılmayıb</span>':""}</span>
    ${sc&&m.kind==="in"&&!saNum(m.cost)?`<span class="costfix"><input class="num" inputmode="decimal" placeholder="Gəliş qiyməti, ₼" data-cost="${m.id}"><button class="btn sm" data-setcost="${m.id}">Yaz</button></span>`:""}
    ${can("admin")&&state.view==="moves"?`<span class="costfix"><button class="btn sm ghost danger" data-delm="${m.id}">Hərəkəti sil</button></span>`:""}</div>`}
async function renderMoves(){mainTabs("moves");if(!state.moves)$("#main").innerHTML='<h2 class="sec">Hərəkətlər</h2><p class="hint">Yüklənir…</p>';await loadMoves();if(state.view!=="moves")return;

    &&(!D||norm(m.doc+" "+m.quoteNo).includes(D))&&(!P||norm(m.party).includes(P))&&(!d1||String(m.date)>=d1)&&(!d2||String(m.date)<=d2));
  const parties=[...new Set(state.moves.map(m=>m.party).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"az"));
  const filtered=D||P||d1||d2||Q,gs=groupMoves(list),sumAll=list.reduce((a,m)=>a+Math.abs(m.qty)*saNum(m.cost),0);
  const noCost=state.moves.filter(m=>m.kind==="in"&&!saNum(m.cost)).length;
  $("#main").innerHTML=`<h2 class="sec">Anbar hərəkətləri</h2><p class="hint">${sc?"Anbardarın qiymətsiz yazdığı mədaxillərə gəliş qiymətini burada əlavə edin — kataloqdakı gəliş qiyməti də yenilənir.":"Bütün mədaxil, məxaric və düzəlişlər."}</p>
  <div class="toolbar"><input type="search" id="mq" placeholder="Axtar: mal, sənəd, təchizatçı, təklif…" value="${esc(state.mq)}"><button class="btn sm" id="bRe">Yenilə</button><button class="btn sm" id="bExp">Excel-ə ixrac</button></div>
  <div class="card" style="gap:8px"><div class="grid2"><label class="f"><span>Qaimə / sənəd №</span><input type="search" id="mdoc" data-mf="mdoc" value="${esc(state.mdoc||"")}" placeholder="məs. MQ2607"></label>
    <label class="f"><span>Şirkət (təchizatçı / müştəri)</span><input type="search" id="mparty" data-mf="mparty" list="mpList" value="${esc(state.mparty||"")}" placeholder="məs. AN-GROUP"></label></div>
    <datalist id="mpList">${parties.map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
    <div class="grid2"><label class="f"><span>Tarixdən</span><input type="date" id="md1" data-mf="md1" value="${esc(d1)}"></label><label class="f"><span>Tarixədək</span><input type="date" id="md2" data-mf="md2" value="${esc(d2)}"></label></div>
    ${filtered?`<div class="actions" style="align-items:center"><span class="note"><b>${gs.length}</b> sənəd · <b>${list.length}</b> sətir${sc&&sumAll?" · cəmi <b>"+money(sumAll)+" ₼</b>":""}</span><button class="btn sm ghost" id="mClr">Filtrləri təmizlə</button></div>`:""}</div>
  <div class="seg filters" style="margin-bottom:12px">${[["all","Hamısı"],["in","Mədaxil"],["out","Məxaric"],["adj","Düzəliş"],...(sc?[["nocost","Qiymətsiz · "+noCost]]:[])].map(([k,l])=>`<button data-f="${k}" aria-pressed="${F===k}">${l}</button>`).join("")}</div>
  ${gs.slice(0,300).map(g=>g.length===1?`<div class="mlist" style="margin-bottom:10px">${moveRow(g[0])}</div>`:
    `<div class="mlist" style="margin-bottom:10px"><div class="mghead"${g[0].doc&&!D?` data-doc="${esc(g[0].doc)}" style="cursor:pointer" title="Yalnız bu qaiməni göstər"`:""}><span class="kchip ${g[0].kind}">${SA_KIND[g[0].kind]}</span><b>${g[0].doc?(g[0].kind==="in"?"Qaimə № ":"Sənəd № ")+esc(g[0].doc):g[0].quoteNo?"Təklif "+esc(g[0].quoteNo):"Sənəd"}</b>
      <span>${esc(g[0].party||"")}</span><span class="note">${fmtDate(g[0].date)} · ${g.length} mal · ${esc(g[0].by)}${g[0].note?" · "+esc(g[0].note):""}</span>
      ${sc&&g.some(m=>saNum(m.cost))?`<span class="money" style="margin-left:auto">${money(g.reduce((a,m)=>a+Math.abs(m.qty)*saNum(m.cost),0))} ₼</span>`:""}</div>${g.map(m=>moveRow(m,true)).join("")}</div>`).join("")
    ||'<div class="mlist"><p class="note" style="padding:16px;margin:0">Hərəkət yoxdur.</p></div>'}`;
  $$(".filters button").forEach(b=>b.onclick=()=>{state.mf=b.dataset.f;renderMoves()});
  $("#mq").oninput=e=>{state.mq=e.target.value;const p=e.target.selectionStart;renderMoves().then(()=>{const i=$("#mq");i.focus();i.setSelectionRange(p,p)})};
  $("#bRe").onclick=async()=>{await loadMoves(true);renderMoves()};
  $$("[data-mf]").forEach(el=>{const ev=el.type==="date"?"onchange":"oninput";el[ev]=()=>{state[el.dataset.mf]=el.value;const id=el.id,p=el.type==="date"?null:el.selectionStart;
    renderMoves().then(()=>{const i=$("#"+id);if(i&&p!==null){i.focus();try{i.setSelectionRange(p,p)}catch(e){}}})}});
  $$(".mghead[data-doc]").forEach(h=>h.onclick=e=>{if(e.target.closest("button,input"))return;state.mdoc=h.dataset.doc;renderMoves();window.scrollTo(0,0)});
  const mc=$("#mClr");if(mc)mc.onclick=()=>{state.mdoc=state.mparty=state.md1=state.md2=state.mq="";renderMoves()};
  $("#bExp").onclick=()=>xlsxDownload("Anbar_herekatleri_"+today()+".xlsx",[["Hərəkətlər",[["Tarix","Növ","Kod","Mal","Say",...(sc?["Gəliş qiyməti","Məbləğ"]:[]),"Sənəd №","Təchizatçı / alıcı","Təklif №","Qeyd","Kim"],
    ...list.map(m=>[m.date,SA_KIND[m.kind],m.code,m.name,m.kind==="out"?-m.qty:m.qty,...(sc?[saNum(m.cost),saR2(Math.abs(m.qty)*saNum(m.cost))]:[]),m.doc,m.party,m.quoteNo,m.note,m.by])],[11,10,16,40,8,12,12,12,24,14,24,16]]]);
  bindCostFix(()=>renderMoves());
  $$("[data-delm]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Təsdiq: sil";return}
    const err=localDelMove(b.dataset.delm);if(err){toast(err);return}renderMoves()})}

function bindCostFix(after){$$("[data-setcost]").forEach(b=>b.onclick=()=>{const id=b.dataset.setcost,v=saNum($(`[data-cost="${id}"]`).value);if(!v){toast("Qiyməti yazın");return}
    localSetCost(id,v);after()})}

/* ================= local (offline-first) changes: applied on screen now, sent to the server later ================= */
function recalc(id){const s=state.stock[id]||(state.stock[id]={q:0,r:0,a:0});s.q=saR2(s.q);s.r=saR2(Math.max(0,s.r));s.a=saR2(s.q-s.r);return s}
function localSaveItem(o,ex,silent){const code=String(o.code||"").trim(),name=String(o.name||"").trim();if(!code)return ERR.code;if(!name)return ERR.name;
  if(state.items.some(x=>String(x.code).toLowerCase()===code.toLowerCase()&&saNormName(x.name)===saNormName(name)&&(!ex||x.id!==ex.id)))return ERR.dupcode;
  const id=ex?ex.id:saId("i");localSaveItem.lastId=id;const now=Date.now(),it={...(ex||{cost:0,price:0,created:now}),...o,id,code,name,updatedAt:now,by:state.me.name};
  ["min","cost","price"].forEach(k=>it[k]=Math.max(0,saR2(saNum(it[k]))));it.svc=!!o.svc;it.active=o.active!==false;
  if(!can("setPrice")){it.price=ex?saNum(ex.price):0;if(ex&&"cost" in ex)it.cost=ex.cost;else delete it.cost}
  const i=state.items.findIndex(x=>x.id===id);if(i>=0)state.items[i]=it;else state.items.push(it);if(!state.stock[id])state.stock[id]={q:0,r:0,a:0};
  saveCache();queueOp("saveItem",{item:{...o,id,code,name}},silent?"":"Yadda saxlanıldı");return ""}
function localAddMoves(p,label){const I=itemsById(),kind=p.kind,lines=p.lines.filter(l=>l.itemId&&saNum(l.qty)!==0);
  if(!lines.length)return ERR.empty;if(kind==="adj"&&!String(p.note||"").trim())return ERR.note;
  const sum={};for(const l of lines){const it=I[l.itemId];if(!it)return ERR.notfound;if(it.svc)return ERR.service({name:it.name});
    if(kind!=="adj"&&saNum(l.qty)<=0)return ERR.qty({name:it.name});sum[it.id]=(sum[it.id]||0)+saNum(l.qty)}
  const rem=p.quoteId?state.remaining[p.quoteId]:null;
  for(const id in sum){const n=sum[id],s=stk(id),it=I[id];
    if(kind==="out"&&n>s.q+1e-9)return ERR.nostock({name:it.name,have:s.q});
    if(kind==="out"&&rem&&(!rem[id]||n>rem[id].left+1e-9))return ERR.overquote({name:it.name,left:rem[id]?rem[id].left:0});
    if(kind==="adj"&&s.q+n<-1e-9)return ERR.nostock({name:it.name,have:s.q})}
  const opId=saId("o"),now=Date.now(),date=p.date||today(),qs=p.quoteId?state.remote[p.quoteId]:null,made=[];
  lines.forEach((l,i)=>{const it=I[l.itemId],n=saR2(saNum(l.qty)),s=recalc(it.id);
    s.q+=kind==="out"?-n:n;if(kind==="out"&&rem&&rem[it.id]){rem[it.id].left=saR2(rem[it.id].left-n);rem[it.id].issued=saR2(rem[it.id].issued+n);s.r-=n}recalc(it.id);
    let cost=kind!=="in"?saNum(it.cost):0;if(kind==="in"&&can("seeCost")&&saNum(l.cost)>0){cost=saR2(saNum(l.cost));it.cost=cost}
    made.push({id:opId+"_"+i,date,kind,itemId:it.id,code:it.code,name:it.name,qty:n,cost,doc:p.doc||"",party:p.party||"",quoteId:p.quoteId||"",quoteNo:qs?qs.no:"",note:p.note||"",by:state.me.name,at:now,pending:true,...(p.reason?{reason:p.reason,expId:"x_"+opId+"_0"}:{})})});
  /* internal use / write-off: the expense appears at once (the server writes the same row) */
  if(p.reason&&can("expense")&&can("seeCost")){const amt=saR2(made.reduce((a,m)=>a+Math.abs(m.qty)*saNum(m.cost),0));
    state.expenses=[{id:"x_"+opId+"_0",date,cat:p.reason==="loss"?"Anbar itkisi (silinmə)":(p.expCat||"Dəftərxana və ofis ləvazimatı"),amount:amt,payee:p.party||(p.reason==="loss"?"Silinmə (yararsız / itki)":"Daxili istifadə"),per:"",method:"Anbardan",doc:p.doc||"",note:made.map(m=>m.name+" × "+m.qty).join("; "),src:"stock",created:now,author:state.me.name,updatedAt:now,by:state.me.name,pending:true},...(state.expenses||[])]}
  if(rem&&qs&&Object.values(rem).every(x=>x.left<=1e-9)){qs.status="done";delete state.remaining[p.quoteId]}
  if(can("seeMoves"))state.moves=[...made,...(state.moves||[])];
  saveCache();queueOp("addMoves",{...p,opId},label+" qeydə alındı");return ""}
function localSetCost(id,v){const m=(state.moves||[]).find(x=>x.id===id);if(!m)return;m.cost=saR2(v);
  const last=(state.moves||[]).filter(x=>x.itemId===m.itemId&&x.kind==="in"&&saNum(x.cost)>0)[0],it=state.items.find(x=>x.id===m.itemId);if(it&&last&&last.id===id)it.cost=m.cost;
  saveCache();queueOp("setCost",{id,cost:v},"Gəliş qiyməti yazıldı")}
function localDelMove(id){const m=(state.moves||[]).find(x=>x.id===id);if(!m)return ERR.notfound;const s=stk(m.itemId);
  if(m.kind!=="out"&&s.q-saNum(m.qty)<-1e-9)return ERR.nostock({name:m.name,have:s.q});

function saveInv(v,approve){
  if(!String(v.no).trim()){toast(ERR.invno);return}if(!String(v.supplier).trim()){toast(ERR.supplier);return}if(!v.lines.length){toast(ERR.empty);return}
  const bad=v.lines.findIndex(l=>!l.itemId&&!l.isNew);if(bad>=0){toast((bad+1)+"-ci sətir: kataloqdan mal seçin və ya “Yeni mal kimi yarat”");return}
  const dup=(state.invoices||[]).find(x=>x.id!==v.id&&x.no.toLowerCase()===String(v.no).trim().toLowerCase()&&(x.voen===v.voen||norm(x.supplier)===norm(v.supplier)));if(dup){toast(ERR.dupinv({no:v.no}));return}
  /* new catalog items first (they go to the server before the invoice) */
  for(const l of v.lines.filter(l=>l.isNew)){let code=String(l.newCode||"").trim();
    if(!code){const base=(l.srcCode&&!/^\d{8,}$/.test(l.srcCode)?l.srcCode:"Q-"+saNormName(l.newName||l.srcName).toUpperCase().split(" ").filter(Boolean).slice(0,3).join("-")).slice(0,40);code=base;let n=2;while(state.items.some(x=>x.code.toLowerCase()===code.toLowerCase()))code=base+"-"+(n++)}
    const err=localSaveItem({code,name:String(l.newName||l.srcName).trim(),unit:l.unit||"ədəd",cat:l.svc?"Xidmət":"",brand:"",model:"",desc:"",min:0,svc:!!l.svc,active:true,cost:l.price,price:0},null,true);
    if(err){toast(code+": "+err);return}const it=state.items.find(x=>x.id===localSaveItem.lastId);l.itemId=it.id;l.isNew=false;l.how="yeni"}
  if(v.imp&&can("seeCost"))impRecalc(v);
  const now=Date.now(),wasNew=!!v.isNew,rec={id:v.id,no:String(v.no).trim(),date:v.date,supplier:String(v.supplier).trim(),voen:String(v.voen||"").replace(/\D/g,""),note:v.note||"",
    lines:v.lines.map(l=>({id:l.id,itemId:l.itemId,srcName:l.srcName,srcCode:l.srcCode,unit:l.unit,qty:saNum(l.qty),price:saNum(l.price),vat:saNum(l.vat),...(v.imp?{fprice:saNum(l.fprice)}:{})})),...(v.imp?{imp:clone(v.imp)}:{})};
  const I=itemsById(),old=(state.invoices||[]).find(x=>x.id===v.id);
  const loc={...(old||{status:"draft",created:now,author:state.me.name}),...rec,lines:rec.lines.map(l=>({...l,code:(I[l.itemId]||{}).code,name:(I[l.itemId]||{}).name,recv:null})),updatedAt:now,by:state.me.name,pending:true};
  if(old&&old.status==="approved"&&!approve)loc.status="approved";
  queueOp("saveInvoice",{invoice:rec,keepStatus:loc.status==="approved"},approve?"":"Qaimə saxlanıldı");
  if(approve){loc.status="approved";loc.approvedBy=state.me.name;loc.returnNote="";
    loc.lines.forEach(l=>{const it=I[l.itemId];if(!it)return;if(l.price>0&&can("seeCost"))it.cost=l.price;const nn=saNormName(l.srcName),al=it.alias?String(it.alias).split("|"):[];if(nn&&!al.includes(nn)){al.push(nn);it.alias=al.join("|")}});
    queueOp("approveInvoice",{id:v.id},"Qaimə təsdiqləndi — anbardara göndərildi")}
  state.invoices=[loc,...(state.invoices||[]).filter(x=>x.id!==v.id)];
  if(wasNew&&v.pdfBuf)pdfPut(v.id,{buf:v.pdfBuf,name:v.fileName||"qaime.pdf"});
  saveCache();INV=null;go("invoices")}

function plistCard(c,ed){if(!c.plist)c.plist=[];const P=c.plist,dis=ed?"":" disabled",sites=[c.client,...String(c.sites||"").split(/[;\n]/)].map(x=>String(x||"").trim()).filter(Boolean);
  const tot={};P.forEach(x=>{const k=x.site||"—";tot[k]=(tot[k]||0)+saNum(x.price)*Math.max(1,saNum(x.n)||1)});
  return `<div class="card" id="plBox"><h3>Cihazlar və servis qiymətləri · ${P.length}</h3><p class="note" style="margin:0">Hər cihazın bir servis səfəri üçün qiyməti (ƏDV-siz). Servis hesabatı gələndə cihaz seriya № ilə, yoxdursa obyekt + ad (marka, model, kVA) ilə tapılır və satış sənədində ayrıca sətir olur. Tapılmayan cihaz 0 ₼ ilə gəlir — mühasib qiymət yazır.</p>
   <datalist id="plSites">${sites.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
   ${(()=>{const f=saFakeSn(P),k=Object.keys(f);return k.length?`<div class="banner" style="margin:6px 0;border-color:var(--bad)"><b>Seriya № sütununda eyni dəyər bir neçə sətirdə var</b> (${k.map(esc).join(", ")}) — bu seriya nömrəsi deyil (çox güman e-qaimədəki xidmət kodudur). Proqram onu nəzərə almır. ${ed?'<button class="btn sm" id="plClrSn">Bu dəyərləri təmizlə</button>':""}</div>`:""})()}
   <div class="maptbl"><table class="ltbl"><tr><th style="text-align:left">Obyekt</th><th style="text-align:left">Cihaz (marka, model, kVA)</th><th style="text-align:left">Seriya №</th><th>Say</th><th>Qiymət, ₼ (1 əd.)</th><th></th></tr>
   ${P.map((x,i)=>`<tr><td><input data-pl="${i}.site" list="plSites" value="${esc(x.site||"")}"${dis} style="min-width:120px"></td><td><input data-pl="${i}.name" value="${esc(x.name||"")}"${dis} style="min-width:150px"></td><td><input data-pl="${i}.sn" value="${esc(x.sn||"")}"${dis} style="min-width:90px"${saFakeSn(P)[String(x.sn||"").toLowerCase().replace(/\s+/g,"")]?' title="seriya nömrəsi deyil"':""}></td><td><input data-pl="${i}.n" class="num" inputmode="numeric" value="${saNum(x.n)>1?qf(x.n):"1"}"${dis} style="width:56px"></td><td><input data-pl="${i}.price" class="num" inputmode="decimal" value="${esc(x.price===undefined||x.price===null||x.price===""?"":qf(x.price))}"${dis} style="width:90px"></td><td>${ed?`<button class="btn sm danger" data-pldel="${i}" aria-label="Sil">✕</button>`:""}</td></tr>`).join("")}</table></div>
   ${P.length?`<p class="note" id="plTot" style="margin:6px 0 0">Bir səfər: ${Object.entries(tot).map(([k,v])=>(k==="—"?"":esc(k)+" — ")+"<b>"+AZN(v)+"</b>").join(" · ")}${Object.keys(tot).length>1?" · cəmi <b>"+AZN(Object.values(tot).reduce((a,b)=>a+b,0))+"</b>":""}</p>`:""}
   ${ed?`<div class="actions"><button class="btn sm" id="plAdd">+ Cihaz</button></div>
   <details class="more"><summary>Excel-dən yapışdır</summary><p class="note" style="margin:0">Excel-də 4 sütunu seçib kopyalayın: <b>Obyekt · Cihaz · Seriya № · Qiymət</b> (Obyekt boş ola bilər). Hər sətir bir cihazdır.</p>
    <textarea id="plPaste" rows="4" placeholder="Azərişıq Kazımzadə&#9;Eaton 93PM 60 kVA&#9;GA123&#9;180"></textarea><div class="actions"><button class="btn sm" id="plGo">Siyahıya əlavə et</button></div></details>`:""}</div>`}
function plTotal(c){readPlist(c);const t={};c.plist.forEach(x=>{const k=x.site||"—";t[k]=(t[k]||0)+saNum(x.price)*Math.max(1,saNum(x.n)||1)});const el=$("#plTot");if(el)el.innerHTML="Bir səfər: "+Object.entries(t).map(([k,v])=>(k==="—"?"":esc(k)+" — ")+"<b>"+AZN(v)+"</b>").join(" · ")+(Object.keys(t).length>1?" · cəmi <b>"+AZN(Object.values(t).reduce((a,b)=>a+b,0))+"</b>":"")}
function readPlist(c){$$("[data-pl]").forEach(el=>{const [i,k]=el.dataset.pl.split(".");if(c.plist[+i])c.plist[+i][k]=k==="price"?saNum(el.value):k==="n"?Math.max(1,Math.round(saNum(el.value))||1):el.value.trim()})}
function redrawPlist(c,ed){const box=$("#plBox");if(!box)return;box.outerHTML=plistCard(c,ed);bindPlist(c)}
function bindPlist(c){const ed=can("contract");$$('[data-pl$=".price"],[data-pl$=".n"]').forEach(el=>el.oninput=()=>plTotal(c));
  const cs=$("#plClrSn");if(cs)cs.onclick=()=>{readPlist(c);const f=saFakeSn(c.plist);c.plist.forEach(x=>{if(f[String(x.sn||"").toLowerCase().replace(/\s+/g,"")])x.sn=""});redrawPlist(c,ed);toast("Təmizləndi — “Yadda saxla” basın")};
  const a=$("#plAdd");if(a)a.onclick=()=>{readPlist(c);const last=c.plist[c.plist.length-1];c.plist.push({site:last?last.site:"",name:"",sn:"",price:""});redrawPlist(c,ed);const ins=$$('[data-pl$=".name"]');if(ins.length)ins[ins.length-1].focus()};
  $$("[data-pldel]").forEach(b=>b.onclick=()=>{readPlist(c);c.plist.splice(+b.dataset.pldel,1);redrawPlist(c,ed)});
  const g=$("#plGo");if(g)g.onclick=()=>{readPlist(c);let n=0;$("#plPaste").value.split(/\r?\n/).forEach(line=>{if(!line.trim())return;let f=line.split("\t");if(f.length<2)f=line.split(/;/);
      f=f.map(x=>x.trim());let site="",name="",sn="",price="";
      if(f.length>=4)[site,name,sn,price]=f;else if(f.length===3)[name,sn,price]=f;else[name,price]=f;
      /* an 8+ digit number in the serial column is the e-qaimə goods / service code, not a serial */
      if(/^\d{8,}$/.test(String(sn).replace(/\s/g,"")))sn="";
      c.plist.push({site,name,sn,price:saNum(String(price).replace(/\s/g,"").replace(",",".")),n:1});n++});
    redrawPlist(c,ed);toast(n+" cihaz əlavə olundu — “Yadda saxla” basın")}}
/* ================= Xərclər: ofis xərcləri, maaşlar, vergilər və digər — mühasibat ================= */
const monthOf=d=>String(d||"").slice(0,7);
const AZ_MONTH=ym=>{const m=/^(\d{4})-(\d{2})$/.exec(ym||"");return m?SA_MONTHS[+m[2]-1]+" "+m[1]:ym};
const prevMonth=ym=>{const [y,m]=ym.split("-").map(Number);return m===1?(y-1)+"-12":y+"-"+String(m-1).padStart(2,"0")};
const nextMonth=ym=>{const [y,m]=ym.split("-").map(Number);return m===12?(y+1)+"-01":y+"-"+String(m+1).padStart(2,"0")};
const listExp=()=>(state.expenses||[]).filter(x=>!x.del);
/* the month's result: sales (VAT excluded) − cost of goods issued from the warehouse − expenses */
function monthResult(ym){const Q=listQuotes().filter(s=>(s.status==="accepted"||s.status==="done")&&monthOf(s.date)===ym);
  const sales=Q.reduce((a,s)=>a+saNum(s.net!==undefined?s.net:s.total),0);
  const cogs=(state.moves||[]).filter(m=>!m.del&&m.kind==="out"&&!m.reason&&monthOf(m.date)===ym).reduce((a,m)=>a+Math.abs(saNum(m.qty))*saNum(m.cost),0);
  const X=listExp().filter(x=>monthOf(x.date)===ym),exp=X.reduce((a,x)=>a+saNum(x.amount),0);
  return {sales,cogs,exp,profit:sales-cogs-exp,n:Q.length,X}}
const RECUR=["Ofis icarəsi","Kommunal (işıq, su, qaz)","İnternet və telefon","Maaş","Vergi və sosial ödənişlər"];
async function renderExpenses(){mainTabs("expenses");if(!state.xm)state.xm=monthOf(today());const ym=state.xm,C=state.xc||"";
  if(!state.moves&&can("seeMoves")&&can("seeCost")){$("#main").innerHTML='<h2 class="sec">Xərclər</h2><p class="hint">Yüklənir…</p>';await loadMoves();if(state.view!=="expenses")return}
  const R=monthResult(ym),byCat={};R.X.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+saNum(x.amount));
  const L=R.X.filter(x=>!C||x.cat===C).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.updatedAt||0)-(a.updatedAt||0));
  const prevRec=listExp().filter(x=>monthOf(x.date)===prevMonth(ym)&&RECUR.includes(x.cat));
  $("#main").innerHTML=`<h2 class="sec">Xərclər</h2><p class="hint">Ofis xərcləri, maaşlar, vergilər və digər ödənişlər. Anbardan “daxili istifadə” və ya “silinmə” kimi məxaric edilən mallar burada <span class="chip warn">anbardan</span> nişanı ilə alış qiyməti ilə avtomatik görünür. Ayın nəticəsi: satışlar (ƏDV-siz) − satılan malların maya dəyəri − xərclər.</p>
  <div class="toolbar"><button class="btn" id="xPrev">←</button><input type="month" id="xMonth" value="${ym}" style="max-width:190px"><button class="btn" id="xNext">→</button>
    <select id="xCat"><option value="">Bütün xərc növləri</option>${SA_EXP_CATS.map(c=>`<option ${c===C?"selected":""}>${esc(c)}</option>`).join("")}</select><button class="btn pri" id="xNew">+ Yeni xərc</button></div>
  ${can("seeCost")?`<div class="stats" style="margin-bottom:12px"><div class="stat"><b style="font-size:15px">${money(R.sales)}</b><span>satış, ƏDV-siz ₼ (${R.n} sənəd)</span></div><div class="stat"><b style="font-size:15px">${money(R.cogs)}</b><span>malların maya dəyəri ₼</span></div>
    <div class="stat warn"><b style="font-size:15px">${money(R.exp)}</b><span>xərclər ₼</span></div><div class="stat ${R.profit<0?"bad":"ok"}"><b style="font-size:15px">${money(R.profit)}</b><span>${AZ_MONTH(ym)} — mənfəət ₼</span></div></div>`:`<div class="stats" style="margin-bottom:12px"><div class="stat warn"><b style="font-size:15px">${money(R.exp)}</b><span>${AZ_MONTH(ym)} — xərclər ₼</span></div></div>`}
  ${Object.keys(byCat).length?`<div class="card"><h3>Növlər üzrə · ${AZ_MONTH(ym)}</h3><div class="tot">${SA_EXP_CATS.concat(Object.keys(byCat).filter(k=>!SA_EXP_CATS.includes(k))).filter(k=>byCat[k]).map(k=>`<div><span>${esc(k)}</span><b>${AZN(byCat[k])}</b></div>`).join("")}<div class="grand"><span>Cəmi</span><b>${AZN(R.exp)}</b></div></div></div>`:""}
  ${!R.X.some(x=>RECUR.includes(x.cat))&&prevRec.length?`<div class="card remind"><h3>Daimi xərclər</h3><p class="note" style="margin:0">${AZ_MONTH(prevMonth(ym))} ayında ${prevRec.length} daimi xərc var (icarə, kommunal, maaş, vergi…). Bu aya köçürüb məbləğləri yoxlaya bilərsiniz.</p><div class="actions"><button class="btn" id="xCopy">Keçən aydan köçür (${prevRec.length})</button></div></div>`:""}
  <div class="actions" style="margin-bottom:8px"><button class="btn sm" id="xXls">Excel-ə ixrac (${AZ_MONTH(ym)})</button></div>
  <div class="rlist">${L.map(x=>`<button class="rcard" data-id="${x.id}"><span class="t">${esc(x.cat)}${x.payee?" — "+esc(x.payee):""}</span><span class="r">${AZN(x.amount)}</span>
    <span class="m"><span>${fmtDate(x.date)}</span>${x.src==="stock"?'<span class="chip warn">anbardan</span>':""}${x.per?`<span class="chip">${esc(AZ_MONTH(x.per))} üçün</span>`:""}${x.method?`<span>${esc(x.method)}</span>`:""}${x.doc?`<span class="no">${esc(x.doc)}</span>`:""}${x.note?`<span>${esc(x.note)}</span>`:""}<span>${esc(x.by||x.author||"")}</span>${x.pending?'<span class="chip warn">göndərilməyib</span>':""}</span></button>`).join("")
    ||`<div class="empty"><h3>${AZ_MONTH(ym)} üçün xərc yoxdur</h3><p class="note" style="margin:0">“+ Yeni xərc” ilə əlavə edin.</p></div>`}</div>`;
  $("#xMonth").onchange=e=>{if(e.target.value){state.xm=e.target.value;renderExpenses()}};$("#xPrev").onclick=()=>{state.xm=prevMonth(ym);renderExpenses()};$("#xNext").onclick=()=>{state.xm=nextMonth(ym);renderExpenses()};
  $("#xCat").onchange=e=>{state.xc=e.target.value;renderExpenses()};$("#xNew").onclick=()=>go("expense",null);
  $$(".rcard[data-id]").forEach(b=>b.onclick=()=>go("expense",b.dataset.id));
  const cp=$("#xCopy");if(cp)cp.onclick=()=>{const d=ym+"-01";prevRec.forEach(x=>saveExpLocal({id:saId("x"),date:d,cat:x.cat,amount:x.amount,payee:x.payee,per:x.per?ym:"",method:x.method,doc:"",note:x.note}));toast(prevRec.length+" xərc köçürüldü — məbləğləri yoxlayın");renderExpenses()};
  $("#xXls").onclick=()=>xlsxDownload("Xercler_"+ym+".xlsx",[["Xərclər",[["Tarix","Növ","Kimə / nə üçün","Hansı ay üçün","Ödəniş üsulu","Sənəd №","Qeyd","Məbləğ, ₼"],...R.X.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>[x.date,x.cat,x.payee||"",x.per||"",x.method||"",x.doc||"",x.note||"",saNum(x.amount)]),[],["","","","","","","Cəmi xərc",R.exp],...(can("seeCost")?[["","","","","","","Satış (ƏDV-siz)",R.sales],["","","","","","","Malların maya dəyəri",R.cogs],["","","","","","","Mənfəət",R.profit]]:[])],[12,26,28,12,12,12,30,14]]])}
function saveExpLocal(o){const ex=(state.expenses||[]).find(x=>x.id===o.id);const loc={...(ex||{created:Date.now(),author:state.me.name}),...o,updatedAt:Date.now(),by:state.me.name,pending:true};
  state.expenses=[loc,...(state.expenses||[]).filter(x=>x.id!==o.id)];saveCache();queueOp("saveExpense",{expense:o},"")}
function renderExpense(id){subPage("expenses");header();const ex=id?(state.expenses||[]).find(x=>x.id===id):null;
  const x=ex?{...ex}:{date:today(),cat:"",amount:"",payee:"",per:"",method:SA_EXP_PAY[0],doc:"",note:""};
  const payees=[...new Set(listExp().map(e=>e.payee).filter(Boolean))];
  $("#main").innerHTML=`<h2 class="sec">${ex?"Xərc":"Yeni xərc"}</h2><p class="hint">${ex&&ex.src==="stock"?"Bu xərc anbardan məxaric ilə yaranıb — anbar hərəkəti silinəndə bu xərc də silinir.":"Maaş üçün işçinin adını və hansı ayın maaşı olduğunu yazın."}</p>
  <div class="card"><div class="grid2"><label class="f"><span>Tarix</span><input type="date" data-x="date" value="${esc(x.date)}"></label><label class="f"><span>Məbləğ, ₼</span><input class="num" inputmode="decimal" data-x="amount" value="${x.amount===""?"":qf(x.amount)}"></label></div>
    <div class="grid2"><label class="f"><span>Xərcin növü</span><input data-x="cat" list="xCats" value="${esc(x.cat)}" placeholder="seçin və ya yazın"><datalist id="xCats">${SA_EXP_CATS.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      <label class="f"><span>Kimə / nə üçün</span><input data-x="payee" list="xPay" value="${esc(x.payee||"")}" placeholder="məs. Əliyev Rauf (maaş), Azercell, ofis icarəsi"><datalist id="xPay">${payees.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label></div>
    <div class="grid2"><label class="f"><span>Hansı ay üçün (maaş, icarə…)</span><input type="month" data-x="per" value="${esc(x.per||"")}"></label><label class="f"><span>Ödəniş üsulu</span><select data-x="method">${SA_EXP_PAY.map(m=>`<option ${m===x.method?"selected":""}>${m}</option>`).join("")}</select></label></div>
    <div class="grid2"><label class="f"><span>Sənəd № (qəbz, ödəniş tapşırığı)</span><input data-x="doc" value="${esc(x.doc||"")}"></label><label class="f"><span>Qeyd</span><input data-x="note" value="${esc(x.note||"")}"></label></div></div>
  <div class="actions"><button class="btn pri" id="xSave">Yadda saxla</button><button class="btn ghost" id="xBack">Bağla</button>${ex&&can("admin")?`<button class="btn danger" id="xDel" style="margin-left:auto">Sil</button>`:""}</div>`;
  const val=k=>$(`[data-x="${k}"]`).value;
  $("#xBack").onclick=()=>go("expenses");
  $("#xSave").onclick=()=>{const o={id:ex?ex.id:saId("x")};if(ex&&ex.src==="stock"){o.src="stock";o.moveIds=ex.moveIds}["date","cat","payee","per","method","doc","note"].forEach(k=>o[k]=val(k).trim());o.amount=saNum(val("amount"));
    if(!(o.amount>0)){toast(ERR.amount);return}if(!o.date){toast(ERR.date);return}if(!o.cat)o.cat="Digər";if(o.cat==="Maaş"&&!o.per)o.per=monthOf(o.date);
    saveExpLocal(o);toast("Xərc saxlanıldı");state.xm=monthOf(o.date);go("expenses")};
  const dl=$("#xDel");if(dl)dl.onclick=()=>{if(dl.dataset.sure!=="1"){dl.dataset.sure="1";dl.textContent="Təsdiq: sil";return}
    state.expenses=state.expenses.filter(e=>e.id!==ex.id);saveCache();queueOp("delExpense",{id:ex.id},"Xərc silindi");go("expenses")}}
/* start (after every module is defined) */
loadLocal();
if(!state.me.name)renderWelcome();else startApp();

</script>
</body>
</html>
