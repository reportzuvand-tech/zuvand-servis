name: APK yığ

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fayllar yerinə (GitHub-a qovluqsuz yüklənsə də işləsin)
        run: |
          # fayllar səhvən .github/workflows qovluğuna yüklənibsə, oradan götür
          for f in index.html satis-index.html satis-config.js config.js package.json capacitor.config.json debug.keystore favicon.ico icon-only.png icon-foreground.png icon-background.png splash.png; do
            [ ! -f "$f" ] && [ -f ".github/workflows/$f" ] && cp ".github/workflows/$f" "$f" || true
          done
          # yalnız index.html faylları yüklənibsə, qalan lazımi fayllar burada yaradılır
          [ -f package.json ] || echo '{"name": "zuvand-servis", "version": "1.0.0", "private": true, "dependencies": {"@capacitor/android": "^6.2.0", "@capacitor/app": "^6.0.2", "@capacitor/core": "^6.2.0", "@capacitor/filesystem": "^6.0.3", "@capacitor/local-notifications": "^6.1.1", "@capacitor/share": "^6.0.3"}, "devDependencies": {"@capacitor/assets": "^3.0.5", "@capacitor/cli": "^6.2.0"}}' > package.json
          [ -f capacitor.config.json ] || echo '{"appId": "az.zuvand.servis", "appName": "ZUVAND Servis", "webDir": "www", "server": {"androidScheme": "http", "cleartext": true}, "android": {"allowMixedContent": true}}' > capacitor.config.json
          [ -f config.js ] || echo 'window.UPS_CONFIG = { serverUrl: "", apiKey: "" };' > config.js
          [ -f satis-config.js ] || echo 'window.SA_CONFIG = { serverUrl: "", apiKey: "", hub: true };' > satis-config.js
          # həmişə eyni imza açarı — yeni APK köhnənin üstündən quraşdırılır
          [ -f debug.keystore ] || echo '' | base64 -d > debug.keystore
          mkdir -p www/lib www/satis/lib assets
          [ -f satis-index.html ] && cp -f satis-index.html www/satis/index.html || true
          [ -f satis/index.html ] && cp -f satis/index.html www/satis/index.html || true
          [ -f satis-config.js ] && cp -f satis-config.js www/satis/config.js || true
          [ -f satis/config.js ] && cp -f satis/config.js www/satis/config.js || true
          test -f www/satis/index.html || (echo "satis-index.html tapılmadı" && exit 1)
          [ -f index.html ] && cp -f index.html www/index.html || true
          [ -f config.js ] && cp -f config.js www/config.js || true
          [ -f favicon.ico ] && cp -f favicon.ico www/favicon.ico || true
          for f in icon-only.png icon-foreground.png icon-background.png splash.png; do [ -f "$f" ] && cp -f "$f" assets/ || true; done
          test -f www/index.html || (echo "index.html tapılmadı" && exit 1)

      - name: PDF və Excel kitabxanaları
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js -o www/lib/html2pdf.bundle.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o www/lib/xlsx.full.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js -o www/lib/exceljs.min.js
          cp www/lib/html2pdf.bundle.min.js www/lib/xlsx.full.min.js www/satis/lib/
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -o www/satis/lib/pdf.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js -o www/satis/lib/pdf.worker.min.js

      - name: Capacitor
        run: |
          npm install
          npx cap add android

      - name: İkon (ZUVAND loqosu)
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: Ofis şəbəkəsinə (http) icazə, versiya, imza
        run: |
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$M"
          grep -q usesCleartextTraffic "$M"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle || true
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: APK yığılır
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ZUVAND-Servis-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZUVAND-Servis-APK-v${{ github.run_number }}
          path: ZUVAND-Servis-v*.apk
