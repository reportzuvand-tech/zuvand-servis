<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZUVAND Servis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: field-instrument app — sticky header, horizontal section tabs, one column of form cards; report renders as a white A4 sheet */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E2E8E5; --ink:#15201D; --muted:#5A6964; --line:#C9D3CF;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#D4EAE5;
  --ok:#23704A; --ok-bg:#DAF0E2; --warn:#7F5A00; --warn-bg:#FAEDC4; --bad:#AE2014; --bad-bg:#FADDD8; --idle:#8A9893;
  --paper:#FFFFFF; --paper-ink:#1B1F1E; --paper-line:#B9C2BF; --paper-head:#123B35; --paper-soft:#E6EEEB;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.cols2{display:grid;gap:0 16px}
.col{min-width:0}
@media (min-width:1000px){.wrap,header.top .bar,header.top .tabs{max-width:1120px}.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols2 .col>.card:first-child{margin-top:0}}
.drop{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;cursor:pointer;background:var(--bg);color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{color:var(--accent)}
.maptbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.maptbl table{border-collapse:collapse;width:100%;font-size:12px}
.maptbl th,.maptbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.maptbl th{background:var(--surface2);position:sticky;top:0}
.maptbl td.num{font-family:var(--f-num)}
.fsum{display:flex;gap:8px;flex-wrap:wrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 20px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.sync{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}.sync.ok{color:var(--ok)}.sync.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:focus-visible,.tab:focus-visible,.tcard:focus-visible,.dchip:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:760px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:20px;font:600 14px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .n{font:500 11px var(--f-num);opacity:.7}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2.sec{font:700 22px/1.15 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 4px;text-wrap:balance}
p.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin-bottom:12px}
.card h3{margin:0;font:700 15px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip:empty{display:none}
/* measurement rows */
.mrow{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mhead b{flex:1;min-width:0;font-weight:600}
.mhead .norm{font:500 12px var(--f-num);color:var(--muted)}
.lim{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.lim input{min-height:34px;padding:5px 8px;width:84px}
details.more summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;list-style:none}
details.more summary::-webkit-details-marker{display:none}
/* checklist */
.citem{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.citem:first-of-type{border-top:0;padding-top:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"].s-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.seg button[aria-pressed="true"].s-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.seg button[aria-pressed="true"].s-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.seg button[aria-pressed="true"].s-idle{background:var(--surface2);color:var(--ink);border-color:var(--ink)}
/* battery fast entry */
.probe{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.probe .lbl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.probe .tag{font:700 34px/1 var(--f-disp);letter-spacing:.02em}
.probe .pos{font:500 13px var(--f-num);opacity:.75}
.probe input{background:var(--bg);color:var(--ink);border-color:transparent;font:500 22px var(--f-num);text-align:center;min-height:54px}
.probe label.f>span{color:var(--bg);opacity:.75}
.probe .row{display:flex;gap:8px}
.probe .row .btn{flex:1}
.probe .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.probe .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strings{display:grid;gap:10px}
.sline{display:grid;gap:6px}
.sline .sl{font:700 12px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.cell{border:0;border-radius:6px;min-height:34px;font:500 11px var(--f-num);background:var(--surface2);color:var(--muted);cursor:pointer;padding:0}
.cell.ok{background:var(--ok-bg);color:var(--ok)} .cell.warn{background:var(--warn-bg);color:var(--warn)} .cell.bad{background:var(--bad-bg);color:var(--bad);font-weight:700}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:8px;padding:10px}
.stat b{display:block;font:500 20px var(--f-num);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
/* home list */
.rlist{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.rcard .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .m{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.rcard .no{font-family:var(--f-num);font-size:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;justify-items:start}
.empty h3{margin:0;font:700 20px var(--f-disp);text-transform:uppercase}
.verdict{border-radius:var(--r);padding:14px;font:700 18px/1.2 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict small{display:block;font:500 13px/1.4 var(--f-body);text-transform:none;letter-spacing:0;margin-top:6px;color:var(--ink)}
ul.concl{margin:0;padding-left:18px;display:grid;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.nextbar{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
#hTheme{min-width:42px;font-size:15px}@media (max-width:600px){#hTheme .tl{display:none}}
.dlist{display:grid;gap:6px}.drow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}.drow .k{font:500 12px var(--f-num);color:var(--muted)}.drow .dn{flex:1;min-width:0;display:grid}.drow .dn small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwrap{position:relative}.rwrap.hasdel .rcard{padding-right:64px;padding-bottom:18px}.rdel{position:absolute;right:10px;bottom:8px;min-width:44px;min-height:32px;line-height:1;border:1px solid var(--line);background:var(--surface);color:var(--bad);border-radius:8px;cursor:pointer;font:600 14px var(--f-body);padding:4px 10px}.rdel.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.ltbl{border-collapse:collapse;width:100%;font-size:13px}.ltbl th,.ltbl td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}.ltbl th{background:var(--surface2);font-size:12px;position:sticky;top:0}.ltbl td.c,.ltbl th:not([style]){text-align:center}.ltbl .msep td{background:var(--surface2);font:700 12px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.ltbl tr.pl-done td{background:var(--ok-bg)}.ltbl tr.pl-over td{background:var(--bad-bg)}.ltbl tr.pl-soon td{background:var(--warn-bg)}.ltbl a{color:var(--accent)}
.stars{display:inline-flex;gap:2px}.star{border:0;background:none;font-size:22px;line-height:1;color:var(--line);cursor:pointer;padding:2px}.star.on{color:#E0A100}
.tkfocus{outline:2px solid var(--accent)}
.sigslot{display:grid;gap:8px;align-content:start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}.sigslot img{background:#fff;border-radius:6px;max-width:100%;height:80px;object-fit:contain;border:1px solid var(--line)}.sigempty{height:80px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:13px}
.sigpad{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}.sp-in{background:var(--surface);border-radius:12px;padding:14px;width:min(960px,100%);height:min(620px,100%);display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}
.sp-head{display:flex;justify-content:space-between;align-items:center}.sp-area{position:relative;background:#fff;border:2px dashed #8A9893;border-radius:10px;min-height:160px;overflow:hidden;touch-action:none}.sp-area canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.sp-hint{position:absolute;left:0;right:0;top:40%;text-align:center;color:#8A9893;font-size:15px;pointer-events:none}.sp-line{position:absolute;left:8%;right:8%;bottom:26%;border-bottom:1px solid #C9D3CF;pointer-events:none}.sp-btns{justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:70;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.prow{display:grid;grid-template-columns:2fr 1.2fr .7fr auto;gap:6px;align-items:end}
@media (max-width:440px){.prow{grid-template-columns:1fr 1fr}.prow .wide{grid-column:1/-1}}
/* report paper — deliberately fixed light document look */
.paperwrap{overflow:hidden;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.paperscale{transform-origin:0 0}
.paper{width:733px;background:var(--paper);color:var(--paper-ink);font:11px/1.4 var(--f-body);padding:4px 2px}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--paper-head);padding-bottom:6px}
.paper.pdfmode .ph{display:none!important}
.paper .logo{height:52px;width:auto;display:block;margin-bottom:2px}
.paper .co{font:700 18px var(--f-disp);color:var(--paper-head);text-transform:uppercase}
.paper .coi{font-size:9.5px;color:#55605C}
.paper.act{font:12px/1.5 "Times New Roman",Georgia,serif}.paper.act h1{font:700 16px "Times New Roman",serif;text-align:center;letter-spacing:.06em}
.paper.act table.actsig{width:100%;border:0!important}.paper.act table.actsig td{border:0!important;background:none!important;vertical-align:top;padding:2px 0;width:50%}
.paper.act .acttx{text-align:justify;text-indent:28px;margin:8px 0}.paper.act table.acttb{width:100%;border-collapse:collapse}.paper.act table.acttb th,.paper.act table.acttb td{border:1px solid #333;padding:4px 6px}.paper.act table.acttb .c{text-align:center}
.paper .meta{text-align:right;font-size:10.5px}
.paper h1{font:700 19px var(--f-disp);text-align:center;margin:14px 0 2px;color:var(--paper-head);letter-spacing:.04em}
.paper .sub{text-align:center;color:#55605C;font-style:italic;margin-bottom:10px}
.paper .ov{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 10px}
.paper .ov b{padding:5px 14px;border-radius:3px;font:700 13px var(--f-disp);letter-spacing:.04em}
.paper h4{background:var(--paper-head);color:#fff;margin:12px 0 0;padding:4px 7px;font:700 11.5px var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{border:1px solid var(--paper-line);padding:3px 5px;vertical-align:top}
.paper th{background:var(--paper-soft);font-weight:700;text-align:center}
.paper td.k{background:var(--paper-soft);font-weight:700;width:17%}
.paper td.c{text-align:center}
.paper .num{font-family:var(--f-num);font-size:10px}
.paper .p-ok{background:#D7EFDF;color:#1D6A43} .paper .p-warn{background:#FAEDC4;color:#7A5600} .paper .p-bad{background:#F8D3CD;color:#A01E12;font-weight:700}
.paper ul{margin:6px 0;padding-left:16px}
.paper li{margin-bottom:3px}
.paper .sigwrap{break-inside:avoid;page-break-inside:avoid;margin-top:14px}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:22px}
.paper .sig div{display:grid;gap:14px}.paper .sigimg{display:flex;align-items:flex-end;gap:8px}.paper .sigimg img{height:58px;max-width:230px;object-fit:contain;object-position:left bottom}
.paper .small{font-size:9px;color:#55605C}
.paper .bt td{font-size:8.5px;padding:2px 3px;text-align:center;font-family:var(--f-num)}
.langseg{flex:0 0 auto}.langseg button{flex:0 0 auto;min-width:46px}
.paper .rchart-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:4px 0 2px;font-size:10px}
.paper .rchart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.paper .rchart-box{border:1px solid var(--paper-line);padding:4px 6px 0;margin-top:6px;break-inside:avoid;page-break-inside:avoid}
.paper .rchart-title{display:flex;justify-content:space-between;gap:10px;font-size:10px}
.paper .rchart{display:block;max-width:100%;height:auto}
.remind{border-color:var(--warn);background:var(--warn-bg)}
.remind h3{color:var(--warn)}
.rrow{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tcard{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;font-size:15px}
.tcard:hover{border-color:var(--accent)}
.devbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 0}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dchip .k{font:500 11px var(--f-num);opacity:.75}
.paper h5{margin:9px 0 0;padding:2px 0;font:700 10.5px var(--f-disp);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-head);border-bottom:1px solid var(--paper-line)}
.paper h4.devh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:6px 8px;margin-top:14px}
.paper h4.devh b{padding:2px 8px;border-radius:3px;font-size:10px;letter-spacing:.03em}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ph-item{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.ph-item img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface2);display:block}
.ph-item figcaption{padding:10px;display:grid;gap:8px}
.paper .prow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.paper .pfig{margin:0;border:1px solid var(--paper-line);padding:4px;display:grid;gap:4px;align-content:start}

function idb(){if(_idb)return _idb;_idb=new Promise((res,rej)=>{try{const q=indexedDB.open("ups-photos",1);q.onupgradeneeded=()=>q.result.createObjectStore("p");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});return _idb}
async function idbPut(k,v){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("p","readwrite");tx.objectStore("p").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction("p").objectStore("p").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function photoData(p){if(PHOTO_CACHE[p.id])return PHOTO_CACHE[p.id];let d=await idbGet(p.id);
  if(!d&&p.fid&&hasServer()){try{const g=await api("photo_get",{fid:p.fid});if(g.data){d="data:image/jpeg;base64,"+g.data;idbPut(p.id,d)}}catch(e){}}
  if(d)PHOTO_CACHE[p.id]=d;return d}
async function ensurePhotos(r){r=realOf(r);let n=0;for(const d of r.devices)for(const p of (d.photos||[]))if(!PHOTO_CACHE[p.id]){if(await photoData(p))n++}return n}
async function compressImage(file){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
  const M=1600,k=Math.min(1,M/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);return c.toDataURL("image/jpeg",0.78)}
async function addPhotos(files){const V=state.cur;if(!V.photos)V.photos=[];let n=0;
  for(const f of files){if(f.type&&f.type.indexOf("image")!==0)continue;try{const d=await compressImage(f);const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    PHOTO_CACHE[id]=d;await idbPut(id,d);V.photos.push({id,cap:"",fid:""});n++}catch(e){}}
  if(n){markDirty();toast(n+" şəkil əlavə olundu")}else toast("Şəkil oxunmadı");const y=window.scrollY;renderEditor();window.scrollTo(0,y)}
async function uploadPhotos(r){for(const d of r.devices)for(const p of (d.photos||[])){if(p.fid)continue;const data=PHOTO_CACHE[p.id]||await idbGet(p.id);if(!data)continue;
  const res=await api("photo",{rid:r.id,pid:p.id,client:r.cl.name,repno:r.svc.repno,data:data.split(",")[1]});if(res.fid){p.fid=res.fid}}}

/* ---------------- storage & sync (offline-first, central server) ---------------- */
const CFG=Object.assign({serverUrl:"",apiKey:""},window.UPS_CONFIG||{});
const IS_GAS=!!(window.google&&google.script&&google.script.run);
const IS_APP=!!(window.Capacitor&&typeof Capacitor.isNativePlatform==="function"&&Capacitor.isNativePlatform());
const state={reports:{},remote:{},pending:new Set(),settings:{...DEFAULT_SETTINGS},me:{name:"",url:"",key:""},
  cur:null,plang:"az",tab:"svc",bi:0,dirty:false,saving:null,view:"home",online:null,syncing:false,syncErr:"",lastSync:0,q:""};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const clone=o=>JSON.parse(JSON.stringify(o));
/* ---- report storage on the device: IndexedDB (no size limit like localStorage, and only the changed report is written) ---- */
const RDB={db:null,ok:true,
  open(){if(this.db)return this.db;this.db=new Promise((res,rej)=>{try{const q=indexedDB.open("ups-data",1);q.onupgradeneeded=()=>q.result.createObjectStore("reports");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});return this.db},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const out=[];const c=db.transaction("reports").objectStore("reports").openCursor();c.onsuccess=()=>{const k=c.result;if(k){out.push(k.value);k.continue()}else res(out)};c.onerror=()=>rej(c.error)})},
  async put(list){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("reports","readwrite"),st=tx.objectStore("reports");list.forEach(r=>{if(r&&r.id)st.put(r,r.id)});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  async del(ids){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("reports","readwrite"),st=tx.objectStore("reports");ids.forEach(id=>st.delete(id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}};
async function loadReportsDB(){
  try{const old=LS.get("ups.reports");const L=await RDB.all();L.forEach(r=>{if(r&&r.id)state.reports[r.id]=r});
    if(Array.isArray(old)&&old.length){old.forEach(r=>{if(r&&r.id&&(!state.reports[r.id]||(state.reports[r.id].updatedAt||0)<(r.updatedAt||0)))state.reports[r.id]=r});await RDB.put(Object.values(state.reports))}
    if(old)try{localStorage.removeItem("ups.reports")}catch(e){}}
  catch(e){RDB.ok=false;(LS.get("ups.reports")||[]).forEach(r=>{if(r&&r.id)state.reports[r.id]=r})}}
function loadLocal(){
  (LS.get("ups.pending")||[]).forEach(id=>state.pending.add(id));
  Object.assign(state.me,LS.get("ups.me")||{});
  if(!state.me.url)state.me.url=CFG.serverUrl||"";
  if(!state.me.key)state.me.key=CFG.apiKey||"";
  state.settings={...DEFAULT_SETTINGS,...(LS.get("ups.settings")||{})};
  (LS.get("ups.remote")||[]).forEach(s=>{if(s&&s.id)state.remote[s.id]=s});
  state.tasks=LS.get("ups.tasks")||[];state.taskMe=LS.get("ups.taskMe")||"";state.customers=LS.get("ups.customers")||[];
}
/* save to the device: given reports only (fast), or everything; deleted ids are removed */
function saveLocalReports(list){if(!RDB.ok){if(!LS.set("ups.reports",Object.values(state.reports))){toast("Cihazın yaddaşı dolub: köhnə hesabatları silin");return false}return true}
  const L=list?list.filter(Boolean):Object.values(state.reports);RDB.put(L).catch(()=>toast("Cihazın yaddaşına yazmaq alınmadı"));
  if(!list){RDB.all().then(A=>{const gone=A.map(r=>r.id).filter(id=>!state.reports[id]);if(gone.length)RDB.del(gone)}).catch(()=>{})}return true}
const savePending=()=>LS.set("ups.pending",[...state.pending]);
const hasServer=()=>IS_GAS||!!(state.me.url&&state.me.key);

const API_TIMEOUT={ping:12000,list:20000,tasks:15000,get:20000,parts:20000,ratings:15000,save:45000,photo:60000,pdf:90000};
/* hub address as typed by a person ("192.168.1.10:8787") → full API address */
function hubUrl(u){u=String(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="http://"+u;if(!/script\.google\.com/.test(u)&&!/\/api\/?$/.test(u))u=u.replace(/\/+$/,"")+"/api";return u}
async function api(action,payload={}){
  const body={key:state.me.key,action,worker:state.me.name,...payload};
  if(IS_GAS)return new Promise((res,rej)=>google.script.run
    .withSuccessHandler(r=>{if(r&&r.ok)res(r);else{const e=new Error(r&&r.error||"server");e.server=true;e.data=r||{};rej(e)}})
    .withFailureHandler(e=>rej(e)).api(body));
  if(navigator.onLine===false&&!/^https?:\/\/(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(hubUrl(state.me.url)))throw new Error("offline");
  /* office network first, then the internet address (outside the office); the one that answered is tried first next time */
  const urls=[...new Set([hubUrl(state.me.url),hubUrl(state.me.alt)].filter(Boolean))];if(state.me.via===1&&urls.length>1)urls.reverse();
  let last;for(const u of urls){try{const j=await apiAt(u,body,action);const v=hubUrl(state.me.alt)&&u===hubUrl(state.me.alt)?1:0;if(state.me.via!==v){state.me.via=v;LS.set("ups.me",state.me)}return j}
    catch(e){if(e.server)throw e;last=e}}throw last||new Error("offline")}
async function apiAt(url,body,action){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),API_TIMEOUT[action]||30000);
  try{
    const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl.signal,redirect:"follow"});
    let j;try{j=await res.json()}catch(e){throw new Error("bad_response")}
    if(!j.ok){const e=new Error(j.error||"server");e.server=true;e.data=j;throw e}
    return j}
  finally{clearTimeout(t)}}

function summaryOf(r){r=realOf(r);const A=analyzeReport(r),d0=r.devices[0]||{info:{}},i0=d0.info||{},n=r.devices.length;
  return {id:r.id,repno:r.svc.repno,date:r.svc.date,client:r.cl.name,obj:r.cl.obj,brand:i0.brand||"",model:(i0.model||"")+(n>1?" (+"+(n-1)+" cihaz)":""),sn:i0.sn||"",kva:i0.kva||"",
  types:r.devices.map(d=>d.type).join(","),type:r.svc.type||"",devn:n,fill:fillOf(r),photos:r.devices.reduce((x,d)=>x+((d.photos||[]).length),0),creator:r.creator||"",eng:r.svc.eng,overall:A.overall,cls:A.cls,tested:A.tested,rep:A.rep,att:A.att,next:A.next,updatedAt:r.updatedAt,by:r.by||"",appr:r.appr&&r.appr.at?(r.appr.by||"✓"):"",sub:r.sub&&r.sub.at?(r.sub.by||"✓"):""}}
function blocksOf(r){r=realOf(r);const keep=CUR_TYPE,out=[],ups=r.devices.map((d,i)=>i).filter(i=>TYPES[r.devices[i].type].hasBat);
  ups.forEach(i=>{useType(r.devices[i].type);const V=devProxy(r,i),a=analyze(V),p=Math.floor(num(V.bat.per))||1,pre=ups.length>1?"C"+(i+1)+"-":"";
    a.blocks.filter(b=>b.st).forEach(b=>out.push([pre+b.lab,b.s,b.i%p+1,b.v,b.r,b.t,b.st]))});
  useType(keep);return out}
const clsOfOverall=o=>/TƏCİLİ/.test(o||"")?"bad":/DİQQƏT/.test(o||"")?"warn":o?"ok":"";

let syncTimer=null;
const autoSync=()=>state.me.syncMode!=="manual";
function scheduleSync(ms=2500){clearTimeout(syncTimer);if(!autoSync()){updateSyncBadge();return}syncTimer=setTimeout(sync,ms)}
function editorBusy(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
let pendingRemote=false;
function applyRemoteToOpen(id){
  if(!state.cur||state.cur.id!==id||state.view!=="edit")return;
  if(state.dirty||state.saving)return;
  if(editorBusy()){pendingRemote=true;return}
  pendingRemote=false;const nr=normalize(clone(state.reports[id]));state.reports[id]=nr;const di=state.di;state.rep=lockedRep(nr)?normalize(clone(nr)):nr;setActive(Math.min(di,nr.devices.length-1));
  const y=window.scrollY;renderEditor();window.scrollTo(0,y);toast("Digər cihazdakı dəyişikliklər yükləndi")}
document.addEventListener("focusout",()=>{if(pendingRemote&&state.cur)setTimeout(()=>applyRemoteToOpen(state.cur.id),300)});

/* sync runs in the background and never blocks work: everything is kept on the device first.
   The open report is sent when the editor is left (or the app goes to background); failures back off quietly. */
let syncFail=0;
function nextSyncDelay(){return Math.min(300000,15000*Math.pow(2,Math.max(0,syncFail-1)))}
async function sync(opt={}){
  clearTimeout(syncTimer);
  if(state.syncing){scheduleSync(4000);return}
  if(!hasServer()){updateSyncBadge();return}
  state.syncing=true;updateSyncBadge();let changed=false;
  try{
    for(const id of [...state.pending]){
      const r=state.reports[id];
      if(!r){state.pending.delete(id);continue}
      if(state.cur&&state.cur.id===id&&(state.dirty||state.saving||(state.view==="edit"&&!opt.all&&Date.now()-(state.lastEdit||0)<60000)))continue;
      try{await uploadPhotos(r);const res=await api("save",{report:r,summary:summaryOf(r),blocks:blocksOf(r),items:itemsOf(r)});
        state.pending.delete(id);state.remote[id]={...summaryOf(r),...(res.summary||{})};savePending();changed=true}
      catch(e){
        if(e.server&&e.data&&e.data.error==="conflict"&&e.data.report){
          state.reports[id]=e.data.report;state.pending.delete(id);saveLocalReports([e.data.report]);applyRemoteToOpen(id);
          toast("Bu hesabat başqa cihazda daha yeni dəyişdirilib — yeni versiya yükləndi")}
        else if(e.server&&e.data&&e.data.error==="deleted"){delete state.reports[id];state.pending.delete(id);RDB.del([id]).catch(()=>{});toast("Bir hesabat rəhbər tərəfindən silinib — bu cihazdan da çıxarıldı")}
        else if(e.server&&e.data&&e.data.error==="auth")throw e;
        else if(e.server){state.syncErr="Server xətası: "+e.message}
        else throw e}}
    savePending();
    const L=await api("list");const prevRemote=new Set(Object.keys(state.remote)),gone=new Set(L.deleted||[]);
    const sigBefore=Object.values(state.remote).map(x=>x.id+":"+x.updatedAt).sort().join(",");
    state.remote={};(L.items||[]).forEach(s=>{s.cls=clsOfOverall(s.overall);state.remote[s.id]=s});
    if(Object.values(state.remote).map(x=>x.id+":"+x.updatedAt).sort().join(",")!==sigBefore)changed=true;
    LS.set("ups.remote",Object.values(state.remote));
    /* reports deleted on the server (by the manager, from any device) disappear from this device too */
    const drop=[];for(const id of Object.keys(state.reports)){if(state.pending.has(id)||state.remote[id])continue;if(state.cur&&state.cur.id===id)continue;
      if(gone.has(id)||prevRemote.has(id)){delete state.reports[id];drop.push(id)}}
    if(drop.length){RDB.del(drop).catch(()=>{});changed=true}
    if(L.role)applyWho(L);
    if(L.settings){state.settings={...DEFAULT_SETTINGS,...L.settings};LS.set("ups.settings",state.settings)}
    try{const CU=await api("customers");state.customers=CU.customers||[];LS.set("ups.customers",state.customers)}catch(e){}
    try{const TK=await api("tasks");const sig=JSON.stringify(state.tasks);state.tasks=TK.tasks||[];state.taskMe=TK.me||"";if(JSON.stringify(state.tasks)!==sig)changed=true;LS.set("ups.tasks",state.tasks);LS.set("ups.taskMe",state.taskMe);notifyTasks()}catch(e){}
    /* keep a full copy of every report on the device, so that opening, lists and PDFs never need the internet */
    const need=Object.keys(state.remote).filter(id=>{const loc=state.reports[id];return !state.pending.has(id)&&(!loc||(state.remote[id].updatedAt||0)>(loc.updatedAt||0))&&!(state.cur&&state.cur.id===id&&state.dirty)});
    const got=[];for(const id of need.slice(0,opt.all?400:25)){try{const g=await api("get",{id});if(g.report){state.reports[id]=g.report;got.push(g.report);applyRemoteToOpen(id)}}catch(e){if(!e.server)break}}
    if(got.length){saveLocalReports(got);changed=true}
    state.online=true;state.lastSync=Date.now();state.syncErr="";syncFail=0;scheduleReminders();
    if(need.length>got.length&&got.length)scheduleSync(3000);
  }catch(e){
    state.online=false;syncFail++;
    state.syncErr=e&&e.message==="auth"?"API açarı yanlışdır — Ayarlarda yoxlayın":e&&e.message==="bad_response"?"Server ünvanı yanlışdır — Ayarlarda yoxlayın":"";
  }finally{
    state.syncing=false;updateSyncBadge();
    if(state.online===false)scheduleSync(nextSyncDelay());else if(state.pending.size)scheduleSync(30000);
    if(changed&&state.view==="home"&&document.activeElement?.id!=="q"){const y=window.scrollY;renderHome();window.scrollTo(0,y)}
  }}
window.addEventListener("online",()=>{syncFail=0;scheduleSync(500)});
window.addEventListener("offline",()=>{state.online=false;updateSyncBadge()});
setInterval(()=>{if(autoSync()&&document.visibilityState==="visible"&&!state.syncing&&state.online!==false)sync()},120000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scheduleSync(800);else if(autoSync()){flush().then(()=>sync({all:false}))}});

function updateSyncBadge(){const el=$("#syncState");if(!el)return;const n=state.pending.size;let t,c="";
  if(!hasServer()){t="Server qoşulmayıb";c="warn"}
  else if(state.syncing){t="sinxronlaşır…"}
  else if(state.online===false){t=(n?n+" gözləyir · ":"")+"oflayn — işləməyə davam edin";c="warn"}
  else if(n){t=n+" göndərilməyib"+(autoSync()?"":" · əl ilə");c="warn"}
  else if(!autoSync()&&!state.online){t="əl ilə sinxron";c=""}
  else if(state.online){t="sinxron ✓";c="ok"}
  else t="";
  el.textContent=t;el.className="sync "+c;el.title=state.syncErr||""}

async function persist(r){r=realOf(r);if(r&&r.svc&&!String(r.svc.repno||"").trim()&&!(r.appr&&r.appr.at)&&!r.sample)applyRepNo(r,true);
  r.updatedAt=Date.now();r.by=state.me.name||r.by||"";
  state.reports[r.id]=r;
  if(!saveLocalReports([r]))throw new Error("local");
  if(!r.sample){state.pending.add(r.id);savePending()}updateSyncBadge()}
async function removeReport(id){
  if(state.remote[id]){if(!hasServer())throw new Error("offline");await api("delete",{id});delete state.remote[id];LS.set("ups.remote",Object.values(state.remote))}
  delete state.reports[id];state.pending.delete(id);savePending();RDB.del([id]).catch(()=>{});if(!RDB.ok)saveLocalReports()}
async function saveSettings(){
  LS.set("ups.settings",state.settings);LS.set("ups.me",state.me);
  if(hasServer()&&state.me.role==="admin"){const{co,coaddr,cotel,notify,interval,warn,fail,vwarn,vfail,vhigh,life}=state.settings;await api("settings",{settings:{co,coaddr,cotel,notify,interval,warn,fail,vwarn,vfail,vhigh,life}})}}
/* the device copy is used at once (no waiting for the network); a newer server copy is fetched in the background */
async function getFull(id){
  const loc=state.reports[id],rem=state.remote[id];
  if(loc){if(rem&&!state.pending.has(id)&&(rem.updatedAt||0)>(loc.updatedAt||0)&&hasServer())scheduleSync(500);return loc}
  if(!hasServer())throw new Error("offline");
  const g=await api("get",{id});state.reports[id]=g.report;saveLocalReports([g.report]);return g.report}

let saveTimer=null;
function markDirty(){if(state.rep&&lockedRep(state.rep))return;state.dirty=true;state.lastEdit=Date.now();$("#saveState").textContent="dəyişiklik…";clearTimeout(saveTimer);saveTimer=setTimeout(flush,1000)}
async function flush(){
  clearTimeout(saveTimer);if(!state.cur||!state.dirty)return;
  if(state.saving){await state.saving;return flush()}
  state.dirty=false;
  state.saving=persist(state.cur).then(()=>{$("#saveState").textContent=state.dirty?"dəyişiklik…":"saxlanıldı ✓"})
    .catch(()=>{state.dirty=true;$("#saveState").textContent="saxlanılmadı"})
    .finally(()=>{state.saving=null});
  return state.saving}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});

/* ---------------- home ---------------- */
function listItems(){
  const ids=new Set([...Object.keys(state.reports),...Object.keys(state.remote)]);const out=[];
  ids.forEach(id=>{const loc=state.reports[id],rem=state.remote[id];
    if(loc){const s=summaryOf(normalize(clone(loc)));out.push({...s,local:true,pending:state.pending.has(id),remote:!!rem,pdf:rem&&rem.pdf})}
    else out.push({...rem,cls:rem.cls||clsOfOverall(rem.overall),local:false,pending:false,remote:true})});
  return out}
/* ---------------- planned-service reminders ---------------- */
const REMIND_DAYS=2;
function upcomingAll(){const latest={};
  listItems().forEach(it=>{if(it.local&&state.reports[it.id]&&state.reports[it.id].sample)return;
    const key=it.sn?"sn:"+String(it.sn).toLowerCase():"c:"+String(it.client||"").toLowerCase()+"|"+String(it.obj||"").toLowerCase();
    if(!latest[key]||(it.date||"")>(latest[key].date||""))latest[key]=it});

function upsNominal(V){const u=V.ups||{},S=num(u.kva),pf=num(String(u.pf||"").replace(",","."))||(num(u.kw)&&S?num(u.kw)/S:null)||0.9,P=num(u.kw)||(S?S*pf:null),ph=devPhases(V);

let LOGO_IMG=null;function logoImg(){if(!LOGO)return Promise.resolve(null);if(LOGO_IMG)return Promise.resolve(LOGO_IMG);

/* page header drawn on every PDF page: logo left, report no / date right, rule below */
async function pageHeaderPNG(r,lang,top){const W=1940,H=150,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);const im=await logoImg();const S=state.settings;
  if(im){const h=118,w=im.width*h/im.height;x.drawImage(im,0,8,w,h)}
  else{x.fillStyle="#123B35";x.font="bold 56px 'Roboto Condensed', Arial, sans-serif";x.textBaseline="middle";x.fillText(S.co||tl(lang,"[Şirkət adı]"),0,66)}
  x.textAlign="right";x.fillStyle="#1B1F1E";x.textBaseline="alphabetic";
  x.font="bold 34px 'Noto Sans', Arial, sans-serif";x.fillText(top||(tl(lang,"Hesabat №")+" "+(r.svc.repno||"—")),W,52);
  x.font="30px 'Noto Sans', Arial, sans-serif";x.fillText(tl(lang,"Tarix:")+" "+(fmtDate(r.svc.date)||"—"),W,92);
  x.fillStyle="#55605C";x.font="24px 'Noto Sans', Arial, sans-serif";x.fillText([S.coaddr,S.cotel].filter(Boolean).join("   "),W,126);
  x.fillStyle="#123B35";x.fillRect(0,H-6,W,5);return c.toDataURL("image/png")}
function pageFooterPNG(i,n,lang,title){const W=1940,H=50,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#B9C2BF";x.fillRect(0,2,W,2);x.fillStyle="#55605C";x.font="24px 'Noto Sans', Arial, sans-serif";
  x.textAlign="center";x.fillText(i+" / "+n,W/2,38);x.textAlign="left";x.fillText(title||tl(lang,REPORT_TITLE),0,38);return c.toDataURL("image/png")}
function rChartsHTML(r,a,hd){
  const p=Math.floor(num(r.bat.per))||0;if(!p||!a.rv.length)return "";
  const ref=a.ref,w=num(r.bat.warn),f=num(r.bat.fail);
  const lines=[];if(ref){lines.push({v:ref,t:t("Referans")+" "+fmt(ref),c:"#55605C",d:""});
    if(w!==null)lines.push({v:ref*(1+w/100),t:"+"+w+"% "+t("diqqət"),c:"#B7860B",d:"4 3"});
    if(f!==null)lines.push({v:ref*(1+f/100),t:"+"+f+"% "+t("dəyiş."),c:"#B42318",d:"4 3"})}
  const top=Math.max(...a.rv,...lines.map(l=>l.v))*1.12;
  const W=733,H=150,L=34,R=82,T=12,B=22,pw=W-L-R,ph=H-T-B;
  const y=v=>T+ph-(v/top)*ph;
  const step=top>20?5:top>8?2:1,ticks=[];for(let k=0;k<=top;k+=step)ticks.push(k);
  const col={"Normal":"#5AA982","Diqqət":"#E0A82E","Dəyişdirilməli":"#C8372D"};
  let h=`<div class="rchart-legend"><span><i style="background:#5AA982"></i>${t("Normal")}</span><span><i style="background:#E0A82E"></i>${t("Diqqət")}</span><span><i style="background:#C8372D"></i>${t("Dəyişdirilməli")}</span><span class="small">${t("Hər sütun bir blokun daxili müqavimətidir, mΩ")}</span></div>`;
  const ns=Math.ceil(a.tot/p);const boxes=[];
  for(let s=0;s<ns;s++){const bs=a.blocks.slice(s*p,s*p+p);if(!bs.some(b=>b.r!==null))continue;
    const bw=pw/bs.length,gap=Math.min(2,bw*0.25);
    let g=`<svg class="rchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial, sans-serif" font-size="9">`;
    ticks.forEach(k=>{g+=`<line x1="${L}" x2="${L+pw}" y1="${y(k)}" y2="${y(k)}" stroke="#E3E8E6" stroke-width="1"/><text x="${L-5}" y="${y(k)+3}" text-anchor="end" fill="#6B7672">${k}</text>`});
    bs.forEach((b,k)=>{if(b.r===null)return;const x=L+k*bw+gap/2,yy=y(b.r),hh=Math.max(1,T+ph-yy);
      g+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(1,bw-gap).toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" fill="${col[b.st]||"#9AA5A1"}"><title>${b.lab}: ${fmt(b.r)} mΩ, ${t(b.st)}</title></rect>`;
      if(b.st&&b.st!=="Normal")g+=`<text x="${(x+(bw-gap)/2).toFixed(1)}" y="${(yy-3).toFixed(1)}" text-anchor="middle" fill="#1B1F1E" font-weight="bold">${k+1}</text>`});
    lines.forEach(l=>{g+=`<line x1="${L}" x2="${L+pw}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c}" stroke-width="1.2" ${l.d?`stroke-dasharray="${l.d}"`:""}/><text x="${L+pw+4}" y="${y(l.v)+3}" fill="${l.c}">${esc(l.t)}</text>`});

    bs.forEach((b,k)=>{const n=k+1;if(n===1||n%5===0||n===bs.length)g+=`<text x="${(L+k*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="#6B7672">${n}</text>`});

function devLabel(d,i){return (i+1)+". "+TYPES[d.type].title+(devName(d)?" — "+devName(d):"")+(d.loc?" ("+d.loc+")":"")}
/* one row per item: [cihaz, seriya №, növ, detal, kod, say, qeyd]; "Yararsız" = checklist "Nasaz", battery blocks to replace,
   defective parts typed in "İşlər"; "Dəyişdirilib" = replaced / installed parts */
function itemsOf(r){r=realOf(r);const keep=CUR_TYPE,out=[];
  r.devices.forEach((d,i)=>{useType(d.type);const V=devProxy(r,i),dl=devLabel(d,i),sn=(d.info&&d.info.sn)||"";
    CHK.forEach((c,j)=>{const x=d.chk[j];if(x&&x.s==="Nasaz")out.push([dl,sn,"Yararsız",c,"","",x.n||""])});
    if(TYPES[d.type].hasBat){try{const a=analyze(V);if(a.rep.length)out.push([dl,sn,"Yararsız","Akkumulyator bloku"+(V.bat.brand?" ("+V.bat.brand+")":""),"",String(a.rep.length),a.rep.map(b=>b.lab).join(", ")])}catch(e){}}
    (d.bad||[]).filter(x=>x.name).forEach(x=>out.push([dl,sn,"Yararsız",x.name,x.code||"",x.qty||"",x.note||""]));
    (d.parts||[]).filter(x=>x.name).forEach(x=>out.push([dl,sn,"Dəyişdirilib",x.name,x.code||"",x.qty||"",x.note||""]))});
  useType(keep);return out}
/* all items: server sheet "Detallar" + this device's unsent reports; older reports are indexed once in the background */
/* all items are computed from the reports kept on this device (works offline); reports not yet copied to the device come from the server sheet */
async function loadItems(onProg){const rows=[],locIds=new Set();
  Object.values(state.reports).forEach(r0=>{if(!r0||r0.sample)return;try{const r=normalize(clone(r0)),s=summaryOf(r);locIds.add(r.id);itemsOf(r).forEach(it=>rows.push([r.id,s.repno||"",s.date||"",s.client||"",s.obj||"",...it]))}catch(e){}});
  const miss=Object.keys(state.remote).filter(id=>!locIds.has(id));
  if(miss.length&&hasServer()&&state.online!==false){try{const res=await api("parts");(res.rows||[]).forEach(x=>{if(!locIds.has(String(x[0])))rows.push(x)})}catch(e){}}
  return rows.map(x=>({id:String(x[0]),repno:x[1],date:String(x[2]||"").slice(0,10),client:x[3]||"Adsız müştəri",obj:x[4],dev:x[5],sn:x[6],kind:x[7],name:x[8],code:x[9],qty:x[10],note:x[11]}))}
const yearOf=d=>String(d||"").slice(0,4);

      <label class="f"><span>İl</span><select id="lfYear"><option value="all"${F.year==="all"?" selected":""}>Bütün illər</option>${years.map(y=>`<option${y===F.year?" selected":""}>${y}</option>`).join("")}</select></label>
      <label class="f"><span>Müştəri</span><select id="lfClient"><option value="">Bütün müştərilər</option>${clients.map(c=>`<option${c===F.client?" selected":""}>${esc(c)}</option>`).join("")}</select></label>
      <label class="f"><span>Siyahı</span><select id="lfKind"><option value="all"${F.kind==="all"?" selected":""}>Hamısı</option><option value="Yararsız"${F.kind==="Yararsız"?" selected":""}>Yararsız detallar</option><option value="Dəyişdirilib"${F.kind==="Dəyişdirilib"?" selected":""}>Dəyişdirilmiş detallar</option></select></label></div>
      <div class="actions"><button class="btn pri" id="lPdf">PDF</button><button class="btn" id="lXls">Excel</button><button class="btn" id="lRe">Yenilə</button></div>

      ${cs.map(c=>`<tr><td><a href="#" data-lc="${esc(c)}">${esc(c)}</a></td><td class="c">${svc.filter(x=>(x.client||"Adsız müştəri")===c).length}</td><td class="c">${cnt(c,"Yararsız")||"—"}</td><td class="c">${cnt(c,"Dəyişdirilib")||"—"}</td></tr>`).join("")}</table></div>`:`<p class="note">Seçilən dövrdə məlumat yoxdur.</p>`}
      ${Object.keys(by).sort((a,b)=>a.localeCompare(b)).map(c=>`<h3 style="margin-top:12px">${esc(c)}</h3><div class="maptbl"><table class="ltbl"><tr><th>Tarix</th><th>Hesabat №</th><th style="text-align:left">Cihaz</th><th>Növ</th><th style="text-align:left">Detal</th><th>Kod</th><th>Say</th><th style="text-align:left">Qeyd</th></tr>
        ${by[c].map(x=>`<tr><td class="c">${esc(fmtDate(x.date))}</td><td class="c">${esc(x.repno||"—")}</td><td>${esc(x.dev)}${x.sn?`<br><span class="note">SN ${esc(x.sn)}</span>`:""}</td><td class="c"><span class="chip ${x.kind==="Yararsız"?"bad":"ok"}">${esc(x.kind)}</span></td><td>${esc(x.name)}</td><td class="c">${esc(x.code||"")}</td><td class="c">${esc(x.qty||"")}</td><td>${esc(x.note||"")}</td></tr>`).join("")}</table></div>`).join("")}`;
    $("#lfYear").onchange=e=>{F.year=e.target.value;draw()};$("#lfClient").onchange=e=>{F.client=e.target.value;draw()};$("#lfKind").onchange=e=>{F.kind=e.target.value;draw()};
    document.querySelectorAll("[data-lc]").forEach(a=>a.onclick=e=>{e.preventDefault();F.client=a.dataset.lc;draw();window.scrollTo(0,0)});
    $("#lRe").onclick=()=>{state.itemRows=null;renderLists()};
    $("#lPdf").onclick=()=>exportList("pdf");$("#lXls").onclick=()=>exportList("xlsx")};
  if(state.itemRows){draw();return}
  loadItems((k,n)=>{const m=$("#lstMsg");if(m)m.textContent="Köhnə hesabatlar oxunur… "+k+"/"+n}).then(r=>{state.itemRows=r;if(state.view==="lists")draw()})
    .catch(()=>{const m=$("#lstMsg");if(m)m.textContent="Siyahını yükləmək üçün internet lazımdır"});
  window.scrollTo(0,0)}
function listFiltered(){const F=state.lst;return (state.itemRows||[]).filter(x=>(F.year==="all"||yearOf(x.date)===F.year)&&(!F.client||x.client===F.client)&&(F.kind==="all"||x.kind===F.kind))
  .sort((a,b)=>a.client.localeCompare(b.client)||(b.date||"").localeCompare(a.date||"")||String(a.dev).localeCompare(String(b.dev)))}
async function exportList(kind){const root=await prepareFolder();const F=state.lst,rows=listFiltered();
  if(!rows.length){toast("Seçilən filtrdə detal yoxdur");return}
  const what=F.kind==="Yararsız"?"Yararsız detallar":F.kind==="Dəyişdirilib"?"Dəyişdirilmiş detallar":"Yararsız və dəyişdirilmiş detallar";
  const per=(F.client||"Bütün müştərilər")+" · "+(F.year==="all"?"bütün illər":F.year);
  const head=["Müştəri","Obyekt","Tarix","Hesabat №","Cihaz","Seriya №","Növ","Detal","Kod / Part №","Say","Qeyd"];
  const data=rows.map(x=>[x.client,x.obj||"",fmtDate(x.date),x.repno||"",x.dev,x.sn||"",x.kind,x.name,x.code||"",x.qty||"",x.note||""]);
  const base=safeName(what+"_"+(F.client||"hamisi")+"_"+(F.year==="all"?"butun":F.year)).replace(/\s+/g,"_");
  const by={};rows.forEach(x=>{(by[x.client]=by[x.client]||[]).push(x)});
  const body=Object.keys(by).map(c=>`<div class="blk"><h4>${esc(c)}</h4><table><tr><th>Tarix</th><th>Hesabat №</th><th style="text-align:left">Cihaz</th><th>Növ</th><th style="text-align:left">Detal</th><th>Kod</th><th>Say</th><th style="text-align:left">Qeyd</th></tr>${by[c].map(x=>`<tr><td class="c">${esc(fmtDate(x.date))}</td><td class="c">${esc(x.repno||"—")}</td><td>${esc(x.dev)}${x.sn?" · SN "+esc(x.sn):""}</td><td class="c ${x.kind==="Yararsız"?"p-bad":"p-ok"}">${esc(x.kind)}</td><td>${esc(x.name)}</td><td class="c">${esc(x.code||"")}</td><td class="c">${esc(x.qty||"")}</td><td>${esc(x.note||"")}</td></tr>`).join("")}</table></div>`).join("");
  await exportDoc(kind,{title:what.toUpperCase(),sub:per,body,head,data,base,client:F.client||undefined,root,widths:[24,16,11,14,28,16,12,30,16,6,30]})}
/* shared PDF / Excel export for lists and the schedule */
async function exportDoc(kind,o){const btn=document.activeElement;const old=btn&&btn.textContent;if(btn)btn.disabled=true;
  try{let blob,name;
    if(kind==="xlsx"){if(!await loadExcelJS()){toast("Excel üçün internet lazımdır");return}
      const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Siyahı",{views:[{state:"frozen",ySplit:3}],pageSetup:{paperSize:9,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0}});
      ws.mergeCells(1,1,1,o.head.length);ws.getCell(1,1).value=(state.settings.co?state.settings.co+" — ":"")+o.title;ws.getCell(1,1).font={name:"Arial",size:13,bold:true,color:{argb:"FF123B35"}};
      ws.mergeCells(2,1,2,o.head.length);ws.getCell(2,1).value=o.sub+" · hazırlanıb: "+fmtDate(todayISO());ws.getCell(2,1).font={name:"Arial",size:9,italic:true,color:{argb:"FF55605C"}};
      const hr=ws.getRow(3);o.head.forEach((h,i)=>{const c=hr.getCell(i+1);c.value=h;c.font={name:"Arial",size:9,bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF123B35"}};c.alignment={vertical:"middle",wrapText:true}});
      o.data.forEach((rw,k)=>{const R=ws.getRow(4+k);rw.forEach((v,i)=>{const c=R.getCell(i+1);c.value=v;c.font={name:"Arial",size:9};c.alignment={vertical:"top",wrapText:true};c.border={bottom:{style:"thin",color:{argb:"FFB9C2BF"}}};
        const cls=o.cls&&o.cls(rw,i);if(cls)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:cls}}})});
      (o.widths||[]).forEach((w,i)=>ws.getColumn(i+1).width=w);ws.autoFilter={from:{row:3,column:1},to:{row:3+o.data.length,column:o.head.length}};
      blob=new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});name=o.base+".xlsx"}
    else{if(!window.html2pdf){toast("PDF kitabxanası yüklənməyib");return}
      const p=document.createElement("div");p.className="paper";p.setAttribute("lang","az");p.innerHTML=`<h1>${esc(o.title)}</h1><div class="sub">${esc(o.sub)}</div>`+o.body;
      const pdf=await buildPdf(p,(i,n)=>{if(btn)btn.textContent=i+"/"+n});
      const head=await pageHeaderPNG({svc:{repno:"",date:todayISO()}},"az",o.title.length>38?o.title.slice(0,38)+"…":o.title),n=pdf.internal.getNumberOfPages();
      for(let i=1;i<=n;i++){pdf.setPage(i);pdf.addImage(head,"PNG",8,5,194,15,"zhead","FAST");pdf.addImage(pageFooterPNG(i,n,"az",o.title),"PNG",8,284,194,5)}
      blob=pdf.output("blob");name=o.base+".pdf"}
    await saveFile(name,blob,o.client!==undefined?o.client:"_Siyahılar",o.root)}
  catch(e){toast("Faylı hazırlamaq alınmadı")}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}}

/* ================= servis cədvəli: növbəti servis tarixləri ================= */
const planKey=it=>it.sn?"sn:"+String(it.sn).toLowerCase():"c:"+String(it.client||"").toLowerCase()+"|"+String(it.obj||"").toLowerCase();
function planRows(){const G={};listItems().forEach(it=>{if(it.local&&state.reports[it.id]&&state.reports[it.id].sample)return;(G[planKey(it)]=G[planKey(it)]||[]).push(it)});
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),out=[];
  Object.values(G).forEach(L=>{L.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    L.forEach((it,k)=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(it.next||"");if(!m)return;const later=L.slice(k+1).find(x=>(x.date||"")>(it.date||""));
      const due=new Date(+m[1],+m[2]-1,+m[3]).getTime(),days=Math.round((due-t0)/864e5);
      out.push({...it,days,done:later?later.date:"",st:later?"done":days<0?"over":days<=REMIND_DAYS?"soon":days<=30?"month":"later"})})});
  return out.sort((a,b)=>(a.next||"").localeCompare(b.next||""))}
const planTxt=x=>x.st==="done"?"Servis olunub: "+fmtDate(x.done):x.days<0?(-x.days)+" gün gecikir":x.days===0?"Bu gün":x.days===1?"Sabah":x.days+" gün qalıb";
function renderPlan(){state.view="plan";$("#tabs").hidden=true;$("#hBack").hidden=false;$("#hSettings").hidden=true;
  $("#hTitle").innerHTML='Servis cədvəli<small>Növbəti servis intervalı üzrə</small>';
  const showDone=!!state.planDone,all=planRows(),rows=all.filter(x=>showDone||x.st!=="done");
  const n={over:all.filter(x=>x.st==="over").length,soon:all.filter(x=>x.st==="soon").length,month:all.filter(x=>x.st==="month").length};
  let lastM="";

  <div class="card"><div class="stats"><div class="stat bad"><b>${n.over}</b><span>Gecikən</span></div><div class="stat warn"><b>${n.soon}</b><span>${REMIND_DAYS} gün ərzində</span></div><div class="stat"><b>${n.month}</b><span>30 gün ərzində</span></div></div>
   <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="plDone" style="width:auto;min-height:0" ${showDone?"checked":""}><span>Servis olunmuşları da göstər (yaşıl)</span></label>
   <div class="actions"><button class="btn pri" id="plPdf">PDF</button><button class="btn" id="plXls">Excel</button></div></div>
  ${rows.length?`<div class="maptbl"><table class="ltbl"><tr><th>Növbəti servis</th><th style="text-align:left">Müştəri / obyekt</th><th style="text-align:left">Cihaz</th><th>Son servis</th><th>Vəziyyət</th><th></th></tr>
   ${rows.map(x=>{const mo=(x.next||"").slice(0,7),sep=mo!==lastM?`<tr class="msep"><td colspan="6">${esc(monthName(mo))}</td></tr>`:"";lastM=mo;
     return sep+`<tr class="pl-${x.st}"><td class="c"><b>${esc(fmtDate(x.next))}</b></td><td>${esc(x.client||"Adsız müştəri")}${x.obj?`<br><span class="note">${esc(x.obj)}</span>`:""}</td><td>${esc([x.brand,x.model].filter(Boolean).join(" "))}${x.sn?`<br><span class="note">SN ${esc(x.sn)}</span>`:""}</td><td class="c">${esc(fmtDate(x.date))}<br><span class="note">${esc(x.repno||"")}</span></td><td class="c"><b>${esc(planTxt(x))}</b></td>
       <td class="c">${x.st==="done"?"":`<button class="btn sm" data-plgo="${esc(x.id)}">Servisi başlat</button>${state.me.role==="admin"?` <button class="btn sm" data-pltask="${esc(x.id)}">Tapşırıq ver</button>`:""}`}</td></tr>`}).join("")}</table></div>`:`<div class="empty"><p class="note" style="margin:0">Planlı servis yoxdur.</p></div>`}
  <button class="btn ghost" id="plBack" style="margin-top:12px">← Geri</button>`;
  $("#plBack").onclick=renderHome;$("#plDone").onchange=e=>{state.planDone=e.target.checked;renderPlan()};
  document.querySelectorAll("[data-pltask]").forEach(b=>b.onclick=()=>{const x=all.find(y=>y.id===b.dataset.pltask);if(x)taskForm({title:"Planlı servis"+([x.brand,x.model].filter(Boolean).length?" — "+[x.brand,x.model].filter(Boolean).join(" "):""),client:x.client||"",obj:x.obj||"",date:x.next||"",prio:"Normal",wids:[],note:x.sn?"S/N "+x.sn:""},renderPlan)});
  document.querySelectorAll("[data-plgo]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{startCopy(normalize(clone(await getFull(b.dataset.plgo))))}catch(e){b.disabled=false;toast("Hesabatı açmaq üçün internet lazımdır")}});
  const exp=kind=>{const R=planRows().filter(x=>showDone||x.st!=="done");if(!R.length){toast("Cədvəl boşdur");return}
    const head=["Növbəti servis","Müştəri","Obyekt","Cihaz","Seriya №","Son servis","Hesabat №","Vəziyyət"];
    const data=R.map(x=>[fmtDate(x.next),x.client||"",x.obj||"",[x.brand,x.model].filter(Boolean).join(" "),x.sn||"",fmtDate(x.date),x.repno||"",planTxt(x)]);
    const col={done:["p-ok","FFD7EFDF"],over:["p-bad","FFF8D3CD"],soon:["p-warn","FFFAEDC4"]};
    const body=`<div class="blk"><table><tr><th>Növbəti servis</th><th style="text-align:left">Müştəri / obyekt</th><th style="text-align:left">Cihaz</th><th>Son servis</th><th>Vəziyyət</th></tr>${R.map(x=>`<tr><td class="c"><b>${esc(fmtDate(x.next))}</b></td><td>${esc(x.client||"")}${x.obj?" · "+esc(x.obj):""}</td><td>${esc([x.brand,x.model].filter(Boolean).join(" "))}${x.sn?" · SN "+esc(x.sn):""}</td><td class="c">${esc(fmtDate(x.date))} ${esc(x.repno||"")}</td><td class="c ${(col[x.st]||[""])[0]}">${esc(planTxt(x))}</td></tr>`).join("")}</table></div>`;
    prepareFolder().then(root=>exportDoc(kind,{title:"SERVİS CƏDVƏLİ",sub:"Hazırlanma tarixi: "+fmtDate(todayISO()),body,head,data,base:"Servis_cedveli_"+todayISO(),root,widths:[13,28,20,26,18,12,16,22],cls:(rw,i)=>i===7?(col[R[data.indexOf(rw)].st]||[])[1]:null}))};
  $("#plPdf").onclick=()=>exp("pdf");$("#plXls").onclick=()=>exp("xlsx");window.scrollTo(0,0)}
const MONTHS_AZ=["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];

function modGate(){if(state.me.perms&&!state.me.boss&&!state.me.perms.includes("servis")&&state.me.role!=="admin"&&hasSales())location.href="satis/index.html"}
function applyWho(o){if(!o)return;if(o.role)state.me.role=o.role;if(o.perms){state.me.perms=o.perms;state.me.boss=!!o.boss}state.me.personal=!!o.personal;if(o.personal&&o.name)state.me.name=o.name;LS.set("ups.me",state.me);modGate()}
/* how complete the report is: per device measurements filled (40%), checklist answered (40%), works answered (20%) */
function fillOf(r){r=realOf(r);const keep=CUR_TYPE;let sum=0,n=0;
  try{r.devices.forEach((d,i)=>{useType(d.type);const V=devProxy(r,i);
    const mi=MEAS.map((m,j)=>j).filter(j=>mPh(V,j)>0),mf=mi.filter(j=>d.meas[j]&&d.meas[j].v.slice(0,mPh(V,j)).some(x=>String(x??"").trim()!=="")).length;
    const ci=CHK.map((c,j)=>j).filter(j=>!chkHidden(V,j)),cf=ci.filter(j=>d.chk[j]&&d.chk[j].s).length,wf=d.works.filter(Boolean).length;
    sum+=(mi.length?mf/mi.length:1)*40+(ci.length?cf/ci.length:1)*40+(d.works.length?wf/d.works.length:1)*20;n++})}catch(e){}
  useType(keep);return n?Math.round(sum/n):null}
const whoOf=s=>String(s.creator||s.eng||s.by||"").trim()||"Naməlum";
async function loadRatings(force){if(!hasServer()||state.me.role!=="admin")return {};if(state.ratings&&!force)return state.ratings;
  try{const res=await api("ratings");const M={};(res.rows||[]).forEach(x=>{M[String(x[0])]={score:+x[5]||0,note:x[6]||"",by:x[7]||""}});state.ratings=M}catch(e){state.ratings=state.ratings||{}}
  return state.ratings}
async function saveRating(s,score,note){await api("rate",{id:s.id,repno:s.repno||"",date:s.date||"",client:s.client||"",person:whoOf(s),score:score||"",note:note||""});
  state.ratings=state.ratings||{};if(score)state.ratings[s.id]={score,note,by:state.me.name};else delete state.ratings[s.id]}
const stars=(v,id)=>`<span class="stars" role="group" aria-label="Rəhbər qiyməti">${[1,2,3,4,5].map(k=>`<button class="star${k<=v?" on":""}" data-rate="${esc(id)}" data-v="${k}" aria-label="${k} bal">★</button>`).join("")}</span>`;

  const M=await loadRatings();if(!document.body.contains(box))return;const cur=M[r.id]||{score:0,note:""},s={...summaryOf(r),creator:(state.remote[r.id]||{}).creator||r.creator};
  box.innerHTML=`<h3>Rəhbər qiyməti — ${esc(whoOf(s))}</h3><p class="note" style="margin:0">Yalnız rəhbər görür, hesabata (PDF) düşmür.</p>${stars(cur.score,r.id)}
   <label class="f"><span>Şərh</span><input id="rateNote" value="${esc(cur.note)}" placeholder="məs. ölçmələr tam, şəkillər yoxdur"></label><div class="actions"><button class="btn sm" id="rateSave">Saxla</button>${cur.score?'<button class="btn sm ghost" id="rateDel">Qiyməti sil</button>':""}</div>`;

  box.querySelector("#rateSave").onclick=async()=>{try{await saveRating(s,v,box.querySelector("#rateNote").value.trim());toast("Qiymət saxlanıldı");ratingCard()}catch(e){toast("Saxlamaq alınmadı (internet?)")}};

function inPeriod(d,p){if(p==="all")return true;const t=new Date(),y=t.getFullYear(),m=t.getMonth()+1,pad=x=>String(x).padStart(2,"0");d=String(d||"");

  document.querySelectorAll("[data-tked]").forEach(b=>b.onclick=()=>taskForm({...T(b.dataset.tked)},()=>renderTasks()));
  document.querySelectorAll("[data-tkdel]").forEach(b=>b.onclick=async()=>{if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Silinsin?";return}
    try{const r=await api("task_save",{task:{id:b.dataset.tkdel},remove:true});state.tasks=r.tasks||[];LS.set("ups.tasks",state.tasks);renderTasks()}catch(e){toast("Alınmadı")}});
  document.querySelectorAll("[data-tkdone]").forEach(b=>b.onclick=()=>{const d=$("#tkd-"+b.dataset.tkdone);d.hidden=!d.hidden});
  document.querySelectorAll("[data-tkok]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api("task_done",{id:b.dataset.tkok,note:$("#tkn-"+b.dataset.tkok).value.trim()});state.tasks=r.tasks||[];LS.set("ups.tasks",state.tasks);toast("Tapşırıq sizin adınıza görülmüş qeyd olundu");renderTasks()}catch(e){b.disabled=false;toast("Alınmadı (internet?)")}});
  document.querySelectorAll("[data-tkundo]").forEach(b=>b.onclick=async()=>{try{const r=await api("task_done",{id:b.dataset.tkundo,undo:true});state.tasks=r.tasks||[];LS.set("ups.tasks",state.tasks);renderTasks()}catch(e){toast("Alınmadı")}});
  document.querySelectorAll("[data-tkrep]").forEach(b=>b.onclick=async()=>{try{const r=await getFull(b.dataset.tkrep);const n=normalize(clone(r));state.reports[n.id]=n;openReport(n)}catch(e){toast("Hesabat tapılmadı və ya internet yoxdur")}});
  document.querySelectorAll("[data-tkgo]").forEach(b=>b.onclick=()=>startFromTask(T(b.dataset.tkgo)));
  if(!IS_APP&&window.Notification&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}
  if(focus){const el=$("#tk-"+focus);if(el)el.scrollIntoView({block:"center"})}else window.scrollTo(0,0)}
/* new report from a task: the customer's latest report is copied (devices, set-up); otherwise a blank report with the customer data */
async function startFromTask(t){if(!t)return;const key=s=>String(s||"").trim().toLowerCase();
  const prev=listItems().filter(x=>key(x.client)===key(t.client)&&(!t.obj||!x.obj||key(x.obj)===key(t.obj))&&!(state.reports[x.id]&&state.reports[x.id].sample)).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
  const go=r=>{r.taskId=t.id;if(!r.cl.name)r.cl.name=t.client||"";if(!r.cl.obj)r.cl.obj=t.obj||"";if(!r.cl.addr)r.cl.addr=t.addr||"";startReport(r);state.tab="svc";renderEditor();toast("Tapşırıq üçün hesabat açıldı — saxlananda tapşırıq sizin adınıza görülmüş sayılacaq")};
  if(prev){try{go(nextFrom(normalize(clone(await getFull(prev.id)))));return}catch(e){}}
  typePicker("Xidmət olunacaq cihaz nədir?","“"+(t.client||"Müştəri")+"” üçün əvvəlki hesabat tapılmadı. Cihaz növünü seçin.",tp=>go(blankReport(state.settings,tp)),()=>renderTasks())}
async function taskForm(t,back){state.view="tasks";let W=[];try{W=((await api("workers")).workers||[]).filter(w=>w.active!==false)}catch(e){}
  const clients=[...new Set(listItems().map(x=>x.client).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  $("#main").innerHTML=`<h2 class="sec">${t.id?"Tapşırığı düzəlt":"Yeni tapşırıq"}</h2><div class="card">
   <label class="f"><span>Tapşırıq</span><input id="tfTitle" value="${esc(t.title)}" placeholder="məs. Planlı servis, qəza çağırışı, akkumulyator testi"></label>
   <div class="grid2"><label class="f"><span>Müştəri</span><input id="tfClient" list="tfCl" value="${esc(t.client)}"><datalist id="tfCl">${clients.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label><label class="f"><span>Obyekt</span><input id="tfObj" value="${esc(t.obj)}"></label></div>
   <label class="f"><span>Ünvan</span><input id="tfAddr" value="${esc(t.addr||"")}"></label>
   <div class="grid2"><label class="f"><span>Tarix</span><input type="date" id="tfDate" value="${esc(t.date||"")}"></label><label class="f"><span>Prioritet</span><select id="tfPrio"><option${t.prio!=="Təcili"?" selected":""}>Normal</option><option${t.prio==="Təcili"?" selected":""}>Təcili</option></select></label></div>
   <div><b style="font-size:12px;color:var(--muted)">İŞÇİLƏR (bir və ya bir neçə)</b><div class="actions" style="margin-top:6px">${W.length?W.map(w=>`<label class="dchip" style="cursor:pointer"><input type="checkbox" data-tw="${esc(w.id)}" style="width:auto;min-height:0"${(t.wids||[]).includes(w.id)?" checked":""}> ${esc(w.name)}${w.role==="admin"?" (rəhbər)":""}</label>`).join(""):'<span class="note">İşçi siyahısı boşdur: Ayarlar → İşçilər bölməsində işçiləri əlavə edin.</span>'}</div></div>
   <label class="f"><span>Qeyd</span><textarea id="tfNote">${esc(t.note||"")}</textarea></label>
   <div class="actions"><button class="btn pri" id="tfSave">${t.id?"Saxla":"Tapşırığı ver"}</button><button class="btn ghost" id="tfCancel">Ləğv et</button></div></div>`;
  $("#tfCancel").onclick=back;
  $("#tfSave").onclick=async()=>{const task={...t,title:$("#tfTitle").value.trim(),client:$("#tfClient").value.trim(),obj:$("#tfObj").value.trim(),addr:$("#tfAddr").value.trim(),date:$("#tfDate").value,prio:$("#tfPrio").value,note:$("#tfNote").value.trim(),wids:[...document.querySelectorAll("[data-tw]:checked")].map(x=>x.dataset.tw)};
    if(!task.title){toast("Tapşırığı yazın");return}if(!task.wids.length){toast("Ən azı bir işçi seçin");return}
    const b=$("#tfSave");b.disabled=true;try{const r=await api("task_save",{task});state.tasks=r.tasks||[];LS.set("ups.tasks",state.tasks);toast(t.id?"Tapşırıq yeniləndi":"Tapşırıq verildi — işçinin telefonunda bildiriş çıxacaq");state.tkF="open";renderTasks()}
    catch(e){b.disabled=false;toast(e&&e.message==="unknown_action"?"Hub köhnə versiyadır":"Alınmadı (internet?)")}};window.scrollTo(0,0)}


/* ================= elektron imza: müştəri və servis mühəndisi ekranda imzalayır ================= */
const fmtDT=iso=>{const d=new Date(iso||"");if(isNaN(d))return "";const p=x=>String(x).padStart(2,"0");return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())};
function sigCard(){const r=realOf(state.rep),S=r.sig||{};
  const box=(k,label,name)=>{const x=S[k];return `<div class="sigslot"><b>${label}</b>${x&&x.img?`<img src="${x.img}" alt="İmza"><span class="note">${esc(x.name||name||"")} · ${esc(fmtDT(x.at))}</span>
    <div class="actions"><button class="btn sm" data-sign="${k}">Yenidən imzala</button><button class="btn sm ghost" data-signdel="${k}">Sil</button></div>`
    :`<div class="sigempty">İmzalanmayıb</div><button class="btn pri" data-sign="${k}">✍ İmzala</button>`}</div>`};
  return `<div class="card"><h3>İmzalar</h3><p class="note" style="margin:0">“İmzala” basın — ekranda açılan sahədə barmaqla və ya qələmlə imza atın. İmza hesabata (PDF, Excel, çap) avtomatik düşür.</p>
   <div class="grid2">${box("eng","Servis mühəndisi",r.svc.eng)}${box("cl","Müştəri nümayəndəsi",r.cl.sign||r.cl.person)}</div></div>`}
function openSignPad(kind){const r=realOf(state.rep);const isCl=kind==="cl";
  const ov=document.createElement("div");ov.className="sigpad";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
  ov.innerHTML=`<div class="sp-in"><div class="sp-head"><b>${isCl?"Müştəri nümayəndəsinin imzası":"Servis mühəndisinin imzası"}</b><button class="btn sm ghost" id="spX" aria-label="Bağla">✕</button></div>
   <label class="f"><span>Ad, soyad</span><input id="spName" value="${esc(isCl?(r.cl.sign||r.cl.person||""):(r.svc.eng||state.me.name||""))}"></label>
   <div class="sp-area"><canvas id="spCv"></canvas><span class="sp-hint" id="spHint">Burada barmaqla və ya qələmlə imza atın</span><span class="sp-line"></span></div>
   <div class="actions sp-btns"><button class="btn" id="spClear">Təmizlə</button><button class="btn ghost" id="spCancel">Ləğv et</button><button class="btn pri" id="spOk">Təsdiq et</button></div></div>`;
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  const cv=ov.querySelector("#spCv"),area=ov.querySelector(".sp-area"),ctx=cv.getContext("2d");let strokes=[],cur=null,dpr=1;
  const size=()=>{const w=area.clientWidth,h=area.clientHeight;dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";redraw()};
  const seg=(p0,p1,p2)=>{ctx.lineWidth=p1.w*dpr;ctx.beginPath();if(!p2){ctx.moveTo(p0.x*dpr,p0.y*dpr);ctx.lineTo(p1.x*dpr,p1.y*dpr)}else{const m1={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2},m2={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};ctx.moveTo(m1.x*dpr,m1.y*dpr);ctx.quadraticCurveTo(p1.x*dpr,p1.y*dpr,m2.x*dpr,m2.y*dpr)}ctx.stroke()};
  function redraw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle=ctx.fillStyle="#0B1F4D";ctx.lineCap=ctx.lineJoin="round";strokes.forEach(S=>{if(S.length===1){ctx.beginPath();ctx.arc(S[0].x*dpr,S[0].y*dpr,S[0].w*dpr/2,0,7);ctx.fill()}else for(let i=1;i<S.length;i++)seg(i>1?S[i-2]:S[i-1],S[i-1],S[i])})}
  const pt=e=>{const b=cv.getBoundingClientRect(),pr=e.pointerType==="pen"&&e.pressure>0?e.pressure:0.5;return {x:e.clientX-b.left,y:e.clientY-b.top,w:1.4+pr*2.6}};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);ov.querySelector("#spHint").hidden=true;redraw()});
  cv.addEventListener("pointermove",e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(x=>cur.push(pt(x)));
    ctx.strokeStyle="#0B1F4D";ctx.lineCap=ctx.lineJoin="round";const n=cur.length;if(n>=3)seg(cur[n-3],cur[n-2],cur[n-1]);else if(n===2)seg(cur[0],cur[1])});
  const end=()=>{cur=null};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);cv.addEventListener("pointerleave",end);
  const close=()=>{window.removeEventListener("resize",size);ov.remove();document.body.style.overflow="";state.sigOpen=null};state.sigOpen=close;
  ov.querySelector("#spX").onclick=close;ov.querySelector("#spCancel").onclick=close;
  ov.querySelector("#spClear").onclick=()=>{strokes=[];ov.querySelector("#spHint").hidden=false;redraw()};
  ov.querySelector("#spOk").onclick=()=>{const P=[].concat(...strokes);if(P.length<8){toast("İmza atılmayıb");return}
    let x0=Math.min(...P.map(p=>p.x)),y0=Math.min(...P.map(p=>p.y)),x1=Math.max(...P.map(p=>p.x)),y1=Math.max(...P.map(p=>p.y));const pad=6;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
    const H=140,k=Math.min(H/(y1-y0),520/(x1-x0),2),out=document.createElement("canvas");out.width=Math.max(20,Math.round((x1-x0)*k));out.height=Math.max(20,Math.round((y1-y0)*k));
    const o=out.getContext("2d");o.drawImage(cv,x0*dpr,y0*dpr,(x1-x0)*dpr,(y1-y0)*dpr,0,0,out.width,out.height);
    r.sig=r.sig||{};const name=ov.querySelector("#spName").value.trim();r.sig[kind]={img:out.toDataURL("image/png"),name,at:new Date().toISOString()};
    if(isCl&&name&&!r.cl.sign)r.cl.sign=name;if(!isCl&&name&&!r.svc.eng)r.svc.eng=name;
    markDirty();close();toast(isCl?"Müştərinin imzası əlavə olundu":"Mühəndisin imzası əlavə olundu");const y=window.scrollY;renderEditor();window.scrollTo(0,y)};
  window.addEventListener("resize",size);requestAnimationFrame(size)}

/* daily automatic backup of all reports into the chosen folder (Windows, when the folder permission is already given) */
async function autoBackup(){try{if(!canDir()||LS.get("ups.lastBackup")===todayISO())return;const root=await getRoot();if(!root)return;
  if(await root.queryPermission({mode:"readwrite"})!=="granted")return;const d=await root.getDirectoryHandle("_Yedek",{create:true});
  const fh=await d.getFileHandle("UPS-servis-yedek-"+todayISO()+".json",{create:true}),w=await fh.createWritable();
  await w.write(new Blob([JSON.stringify({app:"ups-servis",v:2,reports:Object.values(state.reports)})],{type:"application/json"}));await w.close();LS.set("ups.lastBackup",todayISO())}catch(e){}}
/* ---------------- boot ---------------- */
$("#hBack").onclick=async()=>{await flush();state.cur=null;state.rep=null;renderHome();sync()};
$("#hSettings").onclick=renderSettings;
/* screen mode: Avto (follows the phone / Windows setting) → İşıqlı → Qaranlıq; remembered on this device */
const THEMES=[["auto","◐ Avto"],["light","☀ İşıqlı"],["dark","☾ Qaranlıq"]];
function applyTheme(m){if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m);else document.documentElement.removeAttribute("data-theme");
  const b=$("#hTheme");if(b){const T=THEMES.find(x=>x[0]===m)||THEMES[0];b.innerHTML=T[1].slice(0,1)+'<span class="tl"> '+T[1].slice(2)+"</span>";b.title="Ekran modu: "+T[1].slice(2)}
  const dark=m==="dark"||(m!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.content=dark?"#0F1513":"#EDF1EF"}
applyTheme(LS.get("ups_theme")||"auto");
$("#hTheme").onclick=()=>{const cur=LS.get("ups_theme")||"auto",i=THEMES.findIndex(x=>x[0]===cur),nx=THEMES[(i+1)%THEMES.length][0];LS.set("ups_theme",nx);applyTheme(nx);toast("Ekran modu: "+THEMES.find(x=>x[0]===nx)[1].slice(2))};
window.addEventListener("resize",fitPaper);
if(IS_APP){try{const AP=(Capacitor.Plugins&&Capacitor.Plugins.App)||Capacitor.registerPlugin("App");
  AP.addListener("resume",()=>scheduleSync(300));
  AP.addListener("backButton",async()=>{if(state.sigOpen){state.sigOpen();return}if(["edit","settings","lists","plan","staff","tasks"].includes(state.view)){await flush();state.cur=null;state.rep=null;renderHome();sync()}else AP.exitApp()})}catch(e){}}
loadLocal();
(async()=>{await loadReportsDB();if(!state.me.name)renderWelcome();else{renderHome();if(autoSync())sync();else updateSyncBadge();autoBackup()}})();
</script>
